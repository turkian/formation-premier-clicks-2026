# Séance 3 — une seule question : comment faire de meilleures photos ? Les
# séances 1 et 2 traitaient de ce que l'appareil peut décider à votre place ;
# la composition est la seule chose qu'il ne décide jamais.
#
# La composition se termine sur ses gestes, sans exercice « appareil en
# main » : la salle a besoin d'une pause plus que d'un exercice. Après une
# seule pause de questions, « Au-delà de la composition » ouvre une autre
# question — pourquoi une photo bien composée peut laisser froid — puis passe
# la main à un bloc partagé, « Ce que la pratique nous apprend ».
#
# L'animateur l'ouvre avec « Pourquoi, et pour qui », à la première personne ;
# puis des photographes du club racontent comment ils ont progressé sans
# perdre le plaisir. La séance se termine sur cette discussion ouverte.
#
# Les photographies d'archives sont du domaine public au Canada (auteur mort
# avant 1972) comme aux États-Unis, hébergées avec le site, jamais liées, et
# créditées : auteur, date, collection. Les photographes encore protégés sont
# nommés et liés, jamais montrés.

numero: 3
titre: Composer, puis progresser
filConducteur: Apprendre à voir → composer → aller au-delà → progresser
question: comment faire de meilleures photos ?
pret: false

blocs:
  # ─────────────────────────────────────────────────────────────────────────
  - id: retour
    titre: Retour sur la séance 2
    resume: Vos photos d'abord, puis une seule histoire — de la vitesse à ce que l'appareil ne décide pas.
    ecrans:
      - id: bilan
        genre: repere
        variante: ouverture
        titre: Retour
        claim: Avez-vous pris des photos depuis la séance 2 ? Qu'avez-vous appris ?
        corps: |
          Une photo réussie, une photo ratée, ou seulement quelque chose que vous avez remarqué
          en regardant autour de vous : **tout compte**.

      - id: rappel-vitesse
        genre: panneau
        titre: La vitesse
        claim: La vitesse, c'est combien de temps la lumière entre. Elle fige ce qui bouge, ou le laisse voir.
        colonnes:
          - titre: Figer
            icone: lucide:snowflake
            corps: Une vitesse rapide. On lit le détail, l'instant est suspendu.
            image:
              id: l3-rappel-figer
              fichier: l2-figer.jpg
              specification: La photo « figer » de la séance 2 · 1/1000 s
              priorite: complement
              alt: Un pilote de motocross dans un virage, les mottes de terre figées en plein vol · 1/1000 s
              credit: Alain Ruelland
          - titre: Laisser voir
            icone: lucide:wind
            corps: Une vitesse lente. On lit la vitesse, l'énergie.
            image:
              id: l3-rappel-laisser-voir
              fichier: l2-laisser-voir.jpg
              specification: La photo « laisser voir le mouvement » de la séance 2 · 1/4 s
              priorite: complement
              alt: Une petite chute sous un tronc couché, l'eau devenue soyeuse par la pose lente
        ton: regle
        icone: lucide:ruler
        encadre: |
          **Deux flous.** Le sujet flou sur un décor net : **il a bougé**. Toute l'image floue :
          **c'est vous**. Dans les deux cas, une vitesse plus rapide.

      - id: rappel-iso
        genre: panneau
        titre: L'ISO
        claim: "L'ISO, c'est le volume. Il amplifie la lumière captée ; il n'en ajoute pas."
        loupe: { zoom: 8 }
        colonnes:
          - titre: Le volume en haut
            icone: lucide:volume-2
            corps: Même lumière, ISO élevé. Nette, un peu de grain.
            image:
              id: l3-rappel-iso-haut
              fichier: l2-iso-nette-bruitee.jpg
              specification: La photo « ISO élevé — nette, bruitée » de la séance 2, recadrée sur une ombre
              priorite: complement
              alt: La station-service au crépuscule, vue de près près de l'armoire à propane, un grain fin dans les ombres
              cadrage: { point: [40, 62], zoom: 3 }
          - titre: Le volume en bas
            icone: lucide:volume-1
            corps: ISO bas, éclaircie après. Plus de bruit, pas moins.
            image:
              id: l3-rappel-iso-bas
              fichier: l2-iso-eclaircie.jpg
              specification: La photo « ISO bas, éclaircie — plus bruitée » de la séance 2, recadrée sur la même ombre
              priorite: complement
              alt: La même vue de près, éclaircie après coup, des taches de couleur dans les ombres
              cadrage: { point: [40, 62], zoom: 3 }
        ton: regle
        icone: lucide:ruler
        encadre: |
          **Le bruit vient du manque de lumière**, pas de l'ISO. Le meilleur ISO est celui qui
          expose correctement votre sujet.

      - id: rappel-m-iso-auto
        genre: panneau
        titre: Un mode à moitié automatique
        claim: "Un mode à moitié automatique : vous gardez l'ouverture et la vitesse, l'appareil choisit l'ISO."
        corps: |
          1. **L'ouverture**, pour la zone nette — vous.
          2. **La vitesse**, pour le mouvement — vous.
          3. **L'ISO**, en dernier, qui expose bien — l'appareil.

          Sur la molette : `M`, avec l'ISO auto.
        ton: regle
        icone: lucide:sun-moon
        encadre: |
          **Plus clair ou plus sombre ? Le bouton `+/−`.** Trop sombre → vers le `+`. Trop
          clair → vers le `−`.
        aparte: |
          L'ISO auto et le bouton `+/−` sont en **section 3** de votre feuille de marque.

      - id: ce-que-l-appareil-ne-decide-pas
        genre: repere
        variante: transition
        titre: Ce que l'appareil ne décide pas
        claim: L'appareil peut décider de la netteté et de l'exposition à votre place. Jamais du cadrage.
        colonnes:
          - titre: Ce qu'il peut décider
            icone: lucide:cpu
            corps: |
              **La netteté** — la mise au point, la vitesse.

              **L'exposition** — l'ouverture, la vitesse, l'ISO.
          - titre: Ce qu'il ne décide jamais
            icone: lucide:frame
            corps: |
              **Le cadrage** — ce qui entre dans l'image, ce qui en sort, et où.

              C'est ce qui reste à apprendre.

