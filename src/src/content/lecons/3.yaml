# Séance 3 — une seule question : comment faire de meilleures photos ? Les
# séances 1 et 2 traitaient de ce que l'appareil peut décider à votre place ;
# la composition est la seule chose qu'il ne décide jamais.
#
# Le développement n'est plus enseigné geste par geste : la retouche s'apprend
# mal à trente, et « Et maintenant ? » l'envoie à un atelier en petit groupe.
# Il en reste le flux de l'animateur et quelques astuces, dans le bloc « Mes
# apprentissages ». Là, l'énoncé de chaque panneau s'adresse aux participants,
# et le corps est le témoignage, à la première personne.
#
# Les photographies d'archives sont du domaine public au Canada (auteur mort
# avant 1972) comme aux États-Unis, hébergées avec le site, jamais liées, et
# créditées : auteur, date, collection. Les photographes encore protégés sont
# nommés et liés, jamais montrés.

numero: 3
titre: Composer, choisir, montrer
filConducteur: Apprendre à voir → composer → choisir → montrer
question: comment faire de meilleures photos ?
pret: false

blocs:
  # ─────────────────────────────────────────────────────────────────────────
  - id: retour
    titre: Retour sur la séance 2
    resume: Vos photos d'abord, puis une seule histoire — de la vitesse à ce que l'appareil ne décide pas.
    ecrans:
      - id: bilan
        genre: repere
        variante: ouverture
        titre: Retour
        claim: Avez-vous pris des photos depuis la séance 2 ? Qu'avez-vous appris ?
        corps: |
          Une photo réussie, une photo ratée, ou seulement quelque chose que vous avez remarqué
          en regardant autour de vous : **tout compte**.

      - id: rappel-vitesse
        genre: panneau
        titre: La vitesse
        claim: La vitesse, c'est combien de temps la lumière entre. Elle fige ce qui bouge, ou le laisse voir.
        colonnes:
          - titre: Figer
            icone: lucide:snowflake
            corps: Une vitesse rapide. On lit le détail, l'instant est suspendu.
            image:
              id: l3-rappel-figer
              fichier: l2-figer.jpg
              specification: La photo « figer » de la séance 2 · 1/1000 s
              priorite: complement
              alt: Un pilote de motocross dans un virage, les mottes de terre figées en plein vol · 1/1000 s
              credit: Alain Ruelland
          - titre: Laisser voir
            icone: lucide:wind
            corps: Une vitesse lente. On lit la vitesse, l'énergie.
            image:
              id: l3-rappel-laisser-voir
              fichier: l2-laisser-voir.jpg
              specification: La photo « laisser voir le mouvement » de la séance 2 · 1/4 s
              priorite: complement
              alt: Une petite chute sous un tronc couché, l'eau devenue soyeuse par la pose lente
        ton: regle
        icone: lucide:ruler
        encadre: |
          **Deux flous.** Le sujet flou sur un décor net : **il a bougé**. Toute l'image floue :
          **c'est vous**. Dans les deux cas, une vitesse plus rapide.

      - id: rappel-iso
        genre: panneau
        titre: L'ISO
        claim: "L'ISO, c'est le volume. Il amplifie la lumière captée ; il n'en ajoute pas."
        loupe: { zoom: 8 }
        colonnes:
          - titre: Le volume en haut
            icone: lucide:volume-2
            corps: Même lumière, ISO élevé. Nette, un peu de grain.
            image:
              id: l3-rappel-iso-haut
              fichier: l2-iso-nette-bruitee.jpg
              specification: La photo « ISO élevé — nette, bruitée » de la séance 2, recadrée sur une ombre
              priorite: complement
              alt: La station-service au crépuscule, vue de près près de l'armoire à propane, un grain fin dans les ombres
              cadrage: { point: [40, 62], zoom: 3 }
          - titre: Le volume en bas
            icone: lucide:volume-1
            corps: ISO bas, éclaircie après. Plus de bruit, pas moins.
            image:
              id: l3-rappel-iso-bas
              fichier: l2-iso-eclaircie.jpg
              specification: La photo « ISO bas, éclaircie — plus bruitée » de la séance 2, recadrée sur la même ombre
              priorite: complement
              alt: La même vue de près, éclaircie après coup, des taches de couleur dans les ombres
              cadrage: { point: [40, 62], zoom: 3 }
        ton: regle
        icone: lucide:ruler
        encadre: |
          **Le bruit vient du manque de lumière**, pas de l'ISO. Le meilleur ISO est celui qui
          expose correctement votre sujet.

      - id: rappel-m-iso-auto
        genre: panneau
        titre: Un mode à moitié automatique
        claim: "Un mode à moitié automatique : vous gardez l'ouverture et la vitesse, l'appareil choisit l'ISO."
        corps: |
          1. **L'ouverture**, pour la zone nette — vous.
          2. **La vitesse**, pour le mouvement — vous.
          3. **L'ISO**, en dernier, qui expose bien — l'appareil.

          Sur la molette : `M`, avec l'ISO auto.
        ton: regle
        icone: lucide:sun-moon
        encadre: |
          **Plus clair ou plus sombre ? Le bouton `+/−`.** Trop sombre → vers le `+`. Trop
          clair → vers le `−`.
        aparte: |
          L'ISO auto et le bouton `+/−` sont en **section 3** de votre feuille de marque.

      - id: ce-que-l-appareil-ne-decide-pas
        genre: repere
        variante: transition
        titre: Ce que l'appareil ne décide pas
        claim: L'appareil peut décider de la netteté et de l'exposition à votre place. Jamais du cadrage.
        colonnes:
          - titre: Ce qu'il peut décider
            icone: lucide:cpu
            corps: |
              **La netteté** — la mise au point, la vitesse.

              **L'exposition** — l'ouverture, la vitesse, l'ISO.
          - titre: Ce qu'il ne décide jamais
            icone: lucide:frame
            corps: |
              **Le cadrage** — ce qui entre dans l'image, ce qui en sort, et où.

              C'est ce qui reste à apprendre.

  # ─────────────────────────────────────────────────────────────────────────
  # Droits des archives, vérifiés avant l'ajout (auteur mort avant 1972, œuvre
  # antérieure à 1929) :
  #   Smith († 1833)      1797  Remarks on Rural Scenery, pl. « On Mill-Bank » et p. 16 —
  #                             Getty Research Institute, numérisé par l'Internet Archive
  #   Robinson († 1901)   1858  George Eastman Museum (Wikimedia Commons)
  #   Robinson († 1901)   1862  Bringing Home the May — reproduit dans The Practical and Junior
  #                             Photographer, avril 1901, p. 257, numérisé par l'Internet
  #                             Archive (Wikimedia Commons)
  #   Robinson († 1901)   1869  Pictorial Effect in Photography, p. 47 — Getty Research
  #                             Institute, numérisé par l'Internet Archive
  - id: histoire
    titre: D'où viennent les règles
    resume: Plus vieilles que la photo, empruntées à la peinture, puis écrites pour les photographes.
    ecrans:
      - id: avant-la-photo
        genre: demonstration
        titre: Avant la photo
        claim: La composition est plus vieille que la photographie.
        images:
          - id: l3-histoire-smith
            specification: >-
              John Thomas Smith, « On Mill-Bank, Westminster », eau-forte de Remarks on Rural
              Scenery, 1797 — une rive de la Tamise : le ciel occupe environ les deux tiers de
              l'image, la terre et l'eau le tiers restant. Getty Research Institute.
            alt: Une gravure d'une rive de la Tamise — des saules, des chaumières, une barque sur l'eau, et un grand ciel au-dessus
            valeur: "Smith, 1797 — le ciel, la terre, l'eau : chacun à sa place"
            credit: John Thomas Smith, 1797, Getty Research Institute
            priorite: utile
          - id: l3-histoire-smith-regle
            specification: >-
              John Thomas Smith, Remarks on Rural Scenery, 1797, page 16 — le passage où il nomme
              la « Rule of thirds » : placer le ciel à environ deux tiers, ou à un tiers, de la
              hauteur. Getty Research Institute.
            alt: Une page imprimée de 1797, en anglais, où l'on lit « Rule of thirds » entre guillemets
            valeur: Smith, 1797 — des règles pour arranger un paysage
            credit: John Thomas Smith, 1797, Getty Research Institute
            priorite: utile
        loupeImages:
          zoom: 3
        aparte: |
          En 1797, le graveur **John Thomas Smith** publie des conseils pour dessiner le paysage.
          Il ne dit pas *quoi* dessiner, mais **comment l'arranger** : quelle place donner au
          ciel, à la terre, à l'eau. C'est ça, composer.

      - id: la-photo-devient-un-art
        genre: demonstration
        titre: La photo devient un art
        claim: Pour être prise au sérieux, la photo a d'abord composé comme la peinture.
        images:
          - id: l3-histoire-robinson
            specification: >-
              Henry Peach Robinson, « Fading Away », 1858 — une jeune femme mourante entourée de
              sa famille, une scène jouée par des modèles et assemblée à partir de cinq négatifs.
              George Eastman Museum, Rochester.
            alt: Une jeune femme alitée près d'une fenêtre, deux femmes à son chevet et un homme de dos qui regarde dehors
            valeur: Robinson, 1858 — une scène jouée, cinq négatifs assemblés
            credit: Henry Peach Robinson, 1858, George Eastman Museum
            priorite: utile
          - id: l3-histoire-robinson-mai
            specification: >-
              Henry Peach Robinson, « Bringing Home the May », 1862 — une scène champêtre : des
              jeunes femmes et des fillettes cueillent et rapportent des branches d'aubépine. Neuf
              négatifs assemblés en un seul tirage panoramique, composé comme un grand tableau.
              Reproduit dans The Practical and Junior Photographer, avril 1901, p. 257.
            alt: Une scène champêtre photographiée comme un tableau — une douzaine de jeunes femmes et de fillettes en robes longues cueillent et portent des branches d'aubépine en fleurs
            valeur: Robinson, 1862 — neuf négatifs, un seul paysage
            credit: Henry Peach Robinson, 1862, Internet Archive
            priorite: utile
        aparte: |
          Robinson a d'abord étudié la peinture. Il **met en scène** : des modèles qui posent,
          des groupes placés, plusieurs négatifs réunis en une seule image. La composition se
          décide avant le déclenchement.

      # Les dix règles du chapitre IX (p. 47-49), toutes — les datées aussi :
      # elles montrent ce qu'on enseignait, et ce qui a changé depuis. Le
      # « jamais » est celui de Robinson ; les versions modernes viennent au
      # bloc suivant, sans renvoi d'ici.
      - id: les-regles-s-ecrivent
        genre: panneau
        titre: Les règles s'écrivent
        claim: Dans les années 1860, des photographes mettent les règles par écrit — pour d'autres photographes.
        illustration:
          id: l3-histoire-robinson-effet
          specification: >-
            Henry Peach Robinson, Pictorial Effect in Photography, 1869, page 47 — le chapitre
            « Simple Rules » : le même château dessiné de face (fig. 1), puis vu de biais après
            quelques dizaines de mètres de marche le long de la rive (fig. 2). Getty Research
            Institute.
          alt: Une page de livre de 1869 titrée « Chapter IX. Simple Rules », avec deux petits dessins du même château, de face puis de biais
          valeur: "Robinson, 1869 — « Simple Rules »"
          credit: Henry Peach Robinson, 1869, Getty Research Institute
          priorite: utile
        corps: |
          **Le point de vue**

          - Changer de place : quelques pas changent les lignes.
          - De biais plutôt que de face.

          **Les lignes**

          - Pas de lignes parallèles ; sous un horizon droit, un premier plan ondulé.
          - Quelques droites parmi les courbes.
          - Jamais les sujets empilés en ligne.

          **L'équilibre**

          - Jamais de symétrie miroir.
          - Une rue ou une rivière, jamais depuis le centre.
          - Jamais l'horizon au milieu.

          **Le cadre**

          - Une image fermée sur ses bords.
          - Une arche jamais appuyée sur le bord du cadre.
        aparte: |
          **William Lake Price** publie des articles sur la composition dès 1860. Le livre de
          **Henry Peach Robinson**, *Pictorial Effect in Photography* (1869), en fait un manuel :
          l'équilibre, les lignes, le triangle, l'ombre et la lumière.

  # ─────────────────────────────────────────────────────────────────────────
  - id: composition
    titre: La composition
    resume: Des gestes qui rendent vos photos meilleures.
    ecrans:
      - id: ouverture
        genre: repere
        variante: ouverture
        titre: La composition
        claim: Composer, c'est décider de ce qui entre dans l'image, de ce qui en sort, et où. C'est ce qui rend une photo meilleure.
        corps: |
          L'appareil vous donne une photo nette et bien exposée. **La composition en fait une
          bonne photo.** Aucun réglage, aucun menu : vos yeux et vos pieds.

          Tout ce qui suit s'applique intégralement au cellulaire.

      - id: simplifier
        genre: panneau
        titre: Simplifier
        claim: Une photo forte dit une seule chose.
        colonnes:
          - titre: Un seul sujet
            icone: lucide:focus
            corps: Si vous ne pouvez pas le dire en un mot, la photo n'est pas prête.
            image:
              id: l3-compo-un-seul-sujet
              specification: Une scène chargée réduite à un seul sujet — « les mains du marchand », pas « le marché »
              priorite: essentiel
          - titre: Se rapprocher
            icone: lucide:footprints
            corps: Trois pas de plus — la photo d'un débutant est presque toujours prise de trop loin.
            image:
              id: l3-compo-pres
              specification: Un sujet photographié trois pas plus près que le cadrage large habituel, réglages identiques
              priorite: essentiel
          - titre: Remplir le cadre
            icone: lucide:maximize
            corps: Le sujet occupe l'image d'un bord à l'autre.
            image:
              id: l3-compo-remplir-le-cadre
              specification: Un visage, une fleur ou un objet qui remplit tout le cadre, sans marge inutile
              priorite: essentiel

      - id: nettoyer
        genre: panneau
        titre: Nettoyer
        claim: Ce qui n'aide pas votre sujet lui nuit.
        colonnes:
          - titre: Les quatre coins
            icone: lucide:scan-eye
            corps: Avant de déclencher, faites le tour des coins — un poteau, une poubelle, un bras coupé.
            image:
              id: l3-compo-quatre-coins
              specification: Un sujet bien cadré, mais une distraction dans un coin — un poteau, une poubelle, un bras coupé
              priorite: essentiel
          - titre: L'arrière-plan d'abord
            icone: lucide:square-dashed
            corps: Choisissez un fond calme, puis placez le sujet devant.
            image:
              id: l3-compo-arriere-plan
              specification: Un sujet devant un fond calme choisi en premier — un mur, un ciel, une haie
              priorite: essentiel
        aparte: |
          **Personne ne regarde ses quatre coins naturellement** : tout le monde regarde le
          sujet. C'est pour ça que ce réflexe-là change tout.

      - id: placer
        genre: panneau
        titre: Placer
        claim: Décidez où va votre sujet — franchement décentré, ou franchement centré. Pas entre les deux.
        colonnes:
          - titre: Les tiers
            icone: lucide:grid-3x3
            corps: Le sujet sur une ligne, ou à un croisement, de la grille.
            image:
              id: l3-compo-tiers
              specification: Un sujet placé sur un croisement des tiers, l'horizon sur une ligne des tiers
              priorite: essentiel
          - titre: Le centre assumé
            icone: lucide:focus
            corps: Au milieu, exprès — un portrait de face, un sujet symétrique.
            image:
              id: l3-compo-centre
              specification: Un sujet franchement centré — un portrait de face, une porte, un arbre seul
              priorite: essentiel
        aparte: |
          **La règle des tiers est un point de départ, pas une loi.** Smith l'a nommée en 1797,
          pour le dessin. La grille de votre appareil ou de votre téléphone trace les tiers pour
          vous.

      - id: donner-de-la-profondeur
        genre: panneau
        titre: Donner de la profondeur
        claim: Une photo est plate. Donnez-lui une épaisseur.
        colonnes:
          - titre: Le point de vue
            icone: lucide:move-diagonal
            corps: Accroupissez-vous, ou levez l'appareil — la hauteur des yeux est le point de vue le plus banal qui existe.
            image:
              id: l3-compo-accroupi
              specification: Un sujet photographié accroupi, plutôt que debout à hauteur d'yeux, à la même distance
              priorite: utile
          - titre: Le premier plan
            icone: lucide:layers-2
            corps: Un élément proche, devant, donne la distance de tout le reste.
            image:
              id: l3-compo-premier-plan
              specification: Un paysage ou une rue avec un élément net au premier plan — une roche, une branche, une clôture
              priorite: utile

      - id: guider-l-oeil
        genre: panneau
        titre: Guider l'œil
        claim: Menez le regard jusqu'à votre sujet.
        colonnes:
          - titre: Les lignes
            icone: lucide:route
            corps: Une route, une clôture, une rive mènent l'œil au sujet.
            image:
              id: l3-compo-lignes
              specification: Une route, une rive ou une clôture qui part d'un coin et mène au sujet
              priorite: utile
          - titre: Le cadre dans le cadre
            icone: lucide:frame
            corps: Une porte, une fenêtre, une arche entourent le sujet.
            image:
              id: l3-compo-cadre-dans-le-cadre
              specification: Un sujet vu à travers une porte, une fenêtre ou une arche qui l'entoure
              priorite: utile

      - id: structurer
        genre: panneau
        titre: Structurer
        claim: Cherchez l'ordre, puis ce qui le brise.
        colonnes:
          - titre: La symétrie
            icone: lucide:flip-horizontal
            corps: Un reflet, une façade — l'axe exactement au centre.
            image:
              id: l3-compo-symetrie
              specification: Une façade ou un reflet dans l'eau, l'axe de symétrie exactement au centre
              priorite: utile
          - titre: La répétition
            icone: lucide:repeat
            corps: Des formes qui se répètent, et une seule qui rompt le rythme.
            image:
              id: l3-compo-repetition
              specification: Des formes répétées — fenêtres, chaises, poteaux — dont une seule diffère
              priorite: utile

      - id: respirer
        genre: panneau
        titre: Respirer
        claim: Le vide et le mouvement font partie de l'image.
        colonnes:
          - titre: L'espace négatif
            icone: lucide:square-dashed
            corps: Beaucoup de vide autour d'un petit sujet le rend plus fort.
            image:
              id: l3-compo-espace-negatif
              specification: Un petit sujet seul dans un grand vide — un oiseau dans le ciel, une personne sur une plage
              priorite: utile
          - titre: Les diagonales
            icone: lucide:move-diagonal
            corps: Une ligne en biais donne du mouvement ; une horizontale, du calme.
            image:
              id: l3-compo-diagonales
              specification: Une ligne forte qui traverse l'image en diagonale — un escalier, une rampe, une branche
              priorite: utile
          - titre: Le nombre impair
            icone: lucide:dice-3
            corps: Trois éléments s'équilibrent mieux que deux, qui se font concurrence.
            image:
              id: l3-compo-nombre-impair
              specification: Trois éléments semblables dans le cadre — trois arbres, trois tasses, trois personnes
              priorite: utile

      - id: cinq-fois-le-meme-objet
        genre: appareil-en-main
        titre: Appareil en main — composer
        claim: Choisissez un objet dans la salle. Photographiez-le cinq fois.
        gestes:
          - "**De loin.**"
          - "**De très près.**"
          - "**En vous accroupissant.**"
          - "**En levant l'appareil au-dessus de votre tête.**"
          - "**En changeant d'arrière-plan.**"
          - "Puis, à votre table : montrez votre préférée, et dites pourquoi."
        cellulaire: |
          Exactement le même exercice, et il fonctionne aussi bien. Activez la grille si ce n'est
          pas déjà fait.
        aparte: |
          **Aucun réglage à toucher.** C'est volontaire : tout le monde réussit.

  # ─────────────────────────────────────────────────────────────────────────
  - id: pause
    titre: Pause et questions
    resume: Le dernier bloc de questions de la formation.
    ecrans:
      - id: la-pause
        genre: repere
        variante: pause
        titre: Pause
        claim: Dix minutes.
        corps: |
          Les papillons adhésifs sont au mur depuis le début de la séance. C'est aussi le moment
          de venir montrer une photo sur votre écran.

      - id: vos-questions
        genre: repere
        variante: questions
        titre: Vos questions
        claim: C'est notre dernière séance ensemble, alors profitez-en.
        corps: |
          On commence par les papillons du mur.

          **Même les questions qui n'ont rien à voir avec cette séance** — matériel, choix d'objectif,
          « pourquoi mes photos ne ressemblent pas à celles d'Instagram ».
        aparte: |
          Les questions auxquelles on ne peut pas répondre en deux minutes deviennent les sujets
          d'atelier de l'année.

  # ─────────────────────────────────────────────────────────────────────────
  # Le témoignage de l'animateur (décision D5) : l'énoncé reste un conseil aux
  # participants, le corps parle à la première personne.
  - id: apprentissages
    titre: Mes apprentissages
    resume: Ce que la pratique m'a appris — de l'intention jusqu'au mur.
    ecrans:
      - id: ouverture
        genre: repere
        variante: ouverture
        titre: Mes apprentissages
        claim: Prenez ce qui vous sert. C'est une pratique, pas une règle.
        corps: |
          Ce qui suit est la pratique de **Jean-Pierre Bluteau**, animateur de la formation
          « Premiers clics » : ce que j'ai appris en photographiant, en me trompant et en
          exposant mes photos.

      - id: pourquoi-pour-qui
        genre: panneau
        titre: Pourquoi, et pour qui
        claim: Aimez vos photos d'abord. Puis demandez-vous pour qui vous les faites.
        corps: |
          Je photographie d'abord pour moi. Une photo que j'aime, je la regarde encore des années
          plus tard ; une photo faite pour plaire, je l'oublie dès qu'elle a fait le tour.

          Avant de déclencher, je me demande **pour qui** est cette image : pour moi, pour ma
          famille, pour un mur, pour le club. La réponse change ce que je garde, comment je la
          développe et où je la montre.

          Les avis des autres m'apprennent beaucoup. Mais ils viennent **après** : si je n'aime
          pas ma photo, aucun compliment ne la sauve.

      - id: le-raw
        genre: panneau
        titre: Le RAW
        claim: Votre JPEG est déjà développé par l'appareil. Photographiez en RAW + JPEG pour garder le choix.
        corps: |
          Un JPEG, c'est l'appareil qui a choisi le contraste, les couleurs, la netteté et la
          balance des blancs. Le RAW garde tout ce que le capteur a reçu, **sans décision
          appliquée** : il a l'air fade, et c'est voulu. C'est un négatif.

          Je règle mes appareils en **`RAW + JPEG`** : le JPEG pour partager tout de suite, le
          RAW en réserve pour les photos qui méritent du travail.
        aparte: |
          Le RAW porte un nom différent chez chaque fabricant — `.CR3`, `.NEF`, `.ARW`, `.RAF`,
          `.RW2`, `.ORF`, `.DNG`. Le vôtre est en **section 4** de votre feuille de marque.

      - id: mon-flux
        genre: panneau
        titre: Mon flux
        claim: Importer, sauvegarder, trier, développer, exporter. Toujours dans cet ordre.
        corps: |
          1. **Importer** — toute la carte, dans un dossier daté.
          2. **Sauvegarder** — une deuxième copie, ailleurs, avant d'effacer la carte.
          3. **Trier** — en deux passages : à l'instinct d'abord, puis parmi les retenues.
          4. **Développer** — seulement les photos gardées.
          5. **Exporter** — une copie pour l'écran ou le papier. L'original ne bouge pas.
        aparte: |
          Le développement ne modifie jamais mon fichier original : les réglages sont enregistrés
          à part. Ce qui peut le perdre, c'est un disque qui lâche — d'où la deuxième copie.

      # Les astuces à venir s'ajoutent à la liste de cet écran, une ligne
      # chacune ; au-delà d'environ 100 mots, un second écran « mes-astuces-2 ».
      - id: mes-astuces
        genre: panneau
        titre: Mes astuces
        claim: Prenez les habitudes qui vous servent, laissez les autres.
        corps: |
          - **Je ne développe jamais avant d'avoir fini de trier.** Sinon, je passe vingt minutes
            sur la troisième photo d'une série, et la septième était meilleure.
          - **Je garde 5 photos sur 100**, et c'est déjà beaucoup. Trier est une compétence
            photographique.
          - **La vibrance plutôt que la saturation** : elle épargne les visages, qui virent à
            l'orange autrement.
          - **Je garde toujours l'original.** Le logiciel ne le touche pas ; un disque qui lâche,
            si.

      - id: imprimer
        genre: panneau
        titre: Imprimer
        claim: Imprimez vos meilleures photos. Sur papier, une photo se regarde ; sur un écran, elle défile.
        corps: |
          Ce que j'ai appris en passant au papier :

          - **une photo sort plus sombre sur papier qu'à l'écran** — je l'éclaircis un peu avant ;
          - **je commence petit** — un 13 × 18 cm chez un bon laboratoire, avant un grand
            format ;
          - **une sélection, pas un album** — dix photos imprimées valent mieux que cent sur un
            disque.

      - id: montrez-vos-photos
        genre: demonstration
        titre: Montrez vos photos
        claim: Une photo qu'on ne montre pas n'existe qu'à moitié. Montrez les vôtres — au club, au mur, en exposition.
        images:
          - id: l3-expositions
            specification: >-
              Montage de photographies de Jean-Pierre Bluteau tirées de ses expositions : quelques
              tirages accrochés, une vue de salle, et deux ou trois images marquantes en plein
              cadre. Une seule image composée, au format de l'écran.
            valeur: des photos sorties de l'ordinateur
            credit: Jean-Pierre Bluteau
            priorite: essentiel

  # ─────────────────────────────────────────────────────────────────────────
  - id: et-maintenant
    titre: Et maintenant ?
    resume: L'entrée dans la vie du club — des dates, des noms, des adresses.
    ecrans:
      - id: le-processus-complet
        genre: panneau
        titre: Le processus complet
        claim: À chaque étape il y a une décision, et c'est vous qui la prenez.
        corps: |
          Voir une scène → comprendre la lumière → choisir les réglages → **composer** →
          déclencher → **choisir** vos meilleures → **les montrer**.

          C'était le sujet de la formation depuis la première minute.

      - id: la-suite
        genre: repere
        variante: ouverture
        titre: Et maintenant ?
        claim: Ce qui compte ne se joue pas pendant ces trois séances. Ça commence tout de suite.
        corps: |
          - 📅 **La prochaine sortie photo** — une date, un lieu, une heure. *Vous êtes tous
            invités, et j'y serai.*
          - 👥 **Un parrain pour chacun** — un membre expérimenté qui accepte vos questions. Son
            nom est sur votre feuillet. **Trouvez-le dans la salle avant de partir.**
          - 💬 **Où poser une question bête** — le groupe du club, mon adresse, et la demi-heure
            avant chaque réunion mensuelle. Tout est sur le feuillet.

      - id: rester-dans-le-mouvement
        genre: repere
        variante: ouverture
        titre: Rester dans le mouvement
        claim: Et après ces trois séances, ça continue — à votre rythme.
        corps: |
          - 🎯 **Un défi mensuel** — une contrainte à la fois. « Ce mois-ci, une photo à
            contre-jour. »
          - 🖼️ **La soirée critique** — on vous expliquera qui parle, dans quel ordre, et ce
            qu'on y cherche, avant que vous y veniez.
          - 🖌️ **Un atelier de retouche** — en petit groupe, plus tard. La retouche s'apprend mal
            à trente, et c'est une occasion de plus de se revoir.

      - id: la-question-de-fin
        genre: repere
        variante: cloture
        titre: La question de fin
        claim: Qui se sent à l'aise, aujourd'hui, de sortir son appareil du mode automatique ?
        corps: |
          À main levée, exactement comme à la séance 1.

          Puis, avant de partir : **qu'est-ce qui vous a le plus servi ?**
        aparte: |
          C'est la même question qu'à la première séance. Vous verrez collectivement le chemin
          parcouru — ce qu'aucun de vous ne peut mesurer tout seul.
