  - id: histoire
    titre: D'où viennent les règles
    resume: Plus vieilles que la photo, empruntées à la peinture, puis écrites pour les photographes.
    ecrans:
      - id: avant-la-photo
        genre: demonstration
        titre: Avant la photo
        claim: La composition est plus vieille que la photographie.
        images:
          - id: l3-histoire-smith
            specification: >-
              John Thomas Smith, « On Mill-Bank, Westminster », eau-forte de Remarks on Rural
              Scenery, 1797 — une rive de la Tamise : le ciel occupe environ les deux tiers de
              l'image, la terre et l'eau le tiers restant. Getty Research Institute.
            alt: Une gravure d'une rive de la Tamise — des saules, des chaumières, une barque sur l'eau, et un grand ciel au-dessus
            valeur: "Smith, 1797 — le ciel, la terre, l'eau : chacun à sa place"
            credit: John Thomas Smith, 1797, Getty Research Institute
            priorite: utile
          - id: l3-histoire-smith-regle
            specification: >-
              John Thomas Smith, Remarks on Rural Scenery, 1797, page 16 — le passage où il nomme
              la « Rule of thirds » : placer le ciel à environ deux tiers, ou à un tiers, de la
              hauteur. Getty Research Institute.
            alt: Une page imprimée de 1797, en anglais, où l'on lit « Rule of thirds » entre guillemets
            valeur: Smith, 1797 — des règles pour arranger un paysage
            credit: John Thomas Smith, 1797, Getty Research Institute
            priorite: utile
        loupeImages:
          zoom: 3
        aparte: |
          En 1797, le graveur **John Thomas Smith** publie des conseils pour dessiner le paysage.
          Il ne dit pas *quoi* dessiner, mais **comment l'arranger** : quelle place donner au
          ciel, à la terre, à l'eau. C'est ça, composer.

      - id: la-photo-devient-un-art
        genre: demonstration
        titre: La photo devient un art
        claim: Pour être prise au sérieux, la photo a d'abord composé comme la peinture.
        images:
          - id: l3-histoire-robinson
            specification: >-
              Henry Peach Robinson, « Fading Away », 1858 — une jeune femme mourante entourée de
              sa famille, une scène jouée par des modèles et assemblée à partir de cinq négatifs.
              George Eastman Museum, Rochester.
            alt: Une jeune femme alitée près d'une fenêtre, deux femmes à son chevet et un homme de dos qui regarde dehors
            valeur: Robinson, 1858 — une scène jouée, cinq négatifs assemblés
            credit: Henry Peach Robinson, 1858, George Eastman Museum
            priorite: utile
          - id: l3-histoire-robinson-mai
            specification: >-
              Henry Peach Robinson, « Bringing Home the May », 1862 — une scène champêtre : des
              jeunes femmes et des fillettes cueillent et rapportent des branches d'aubépine. Neuf
              négatifs assemblés en un seul tirage panoramique, composé comme un grand tableau.
              Reproduit dans The Practical and Junior Photographer, avril 1901, p. 257.
            alt: Une scène champêtre photographiée comme un tableau — une douzaine de jeunes femmes et de fillettes en robes longues cueillent et portent des branches d'aubépine en fleurs
            valeur: Robinson, 1862 — neuf négatifs, un seul paysage
            credit: Henry Peach Robinson, 1862, Internet Archive
            priorite: utile
        aparte: |
          Robinson a d'abord étudié la peinture. Il **met en scène** : des modèles qui posent,
          des groupes placés, plusieurs négatifs réunis en une seule image. La composition se
          décide avant le déclenchement.

      # Les dix règles du chapitre IX (p. 47-49), toutes — les datées aussi :
      # elles montrent ce qu'on enseignait, et ce qui a changé depuis. Le
      # « jamais » est celui de Robinson ; les versions modernes viennent au
      # bloc suivant, sans renvoi d'ici.
      - id: les-regles-s-ecrivent
        genre: panneau
        titre: Les règles s'écrivent
        claim: Dans les années 1860, des photographes mettent les règles par écrit — pour d'autres photographes.
        illustration:
          id: l3-histoire-robinson-effet
          specification: >-
            Henry Peach Robinson, Pictorial Effect in Photography, 1869, page 47 — le chapitre
            « Simple Rules » : le même château dessiné de face (fig. 1), puis vu de biais après
            quelques dizaines de mètres de marche le long de la rive (fig. 2). Getty Research
            Institute.
          alt: Une page de livre de 1869 titrée « Chapter IX. Simple Rules », avec deux petits dessins du même château, de face puis de biais
          valeur: "Robinson, 1869 — « Simple Rules »"
          credit: Henry Peach Robinson, 1869, Getty Research Institute
          priorite: utile
        corps: |
          **Le point de vue**

          - Changer de place : quelques pas changent les lignes.
          - De biais plutôt que de face.

          **Les lignes**

          - Pas de lignes parallèles ; sous un horizon droit, un premier plan ondulé.
          - Quelques droites parmi les courbes.
          - Jamais les sujets empilés en ligne.

          **L'équilibre**

          - Jamais de symétrie miroir.
          - Une rue ou une rivière, jamais depuis le centre.
          - Jamais l'horizon au milieu.

          **Le cadre**

          - Une image fermée sur ses bords.
          - Une arche jamais appuyée sur le bord du cadre.
        aparte: |
          **William Lake Price** publie des articles sur la composition dès 1860. Le livre de
          **Henry Peach Robinson**, *Pictorial Effect in Photography* (1869), en fait un manuel :
          l'équilibre, les lignes, le triangle, l'ombre et la lumière.

