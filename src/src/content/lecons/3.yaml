  - id: composition
    titre: La composition
    resume: Des gestes qui rendent vos photos meilleures.
    ecrans:
      - id: ouverture
        genre: repere
        variante: ouverture
        titre: La composition
        claim: Composer, c'est décider de ce qui entre dans l'image, de ce qui en sort, et où. C'est ce qui rend une photo meilleure.
        corps: |
          L'appareil vous donne une photo nette et bien exposée. **La composition en fait une
          bonne photo.** Aucun réglage, aucun menu : vos yeux et vos pieds.

          Tout ce qui suit s'applique intégralement au cellulaire.

      - id: simplifier
        genre: panneau
        titre: Simplifier
        claim: Une photo forte dit une seule chose.
        colonnes:
          - titre: Un seul sujet
            icone: lucide:focus
            corps: Si vous ne pouvez pas le dire en un mot, la photo n'est pas prête.
            image:
              id: l3-compo-un-seul-sujet
              specification: >-
                Wm. Notman & Son, « Louis Rubenstein, championship figure skater », Montréal, 1893 —
                un patineur en pied, seul devant un fond uni : rien d'autre dans l'image. Musée
                McCord Stewart.
              alt: Un patineur moustachu en chapeau melon, debout sur ses patins, la poitrine couverte de médailles, seul devant un fond gris uni
              credit: Wm. Notman & Son, 1893, Musée McCord Stewart
              priorite: essentiel
          - titre: Se rapprocher
            icone: lucide:footprints
            corps: Trois pas de plus — la photo est presque toujours prise de trop loin.
            image:
              id: l3-compo-pres
              specification: >-
                Julia Margaret Cameron, « Julia Jackson », 1867 — un visage de face, cadré si près
                qu'il occupe presque toute l'image. Metropolitan Museum of Art.
              alt: Le visage d'une jeune femme, de face, cadré serré, à moitié dans l'ombre, les cheveux défaits sur un fond sombre
              credit: Julia Margaret Cameron, 1867, Metropolitan Museum of Art
              priorite: essentiel
          - titre: Remplir le cadre
            icone: lucide:maximize
            corps: Le sujet occupe l'image d'un bord à l'autre.
            image:
              id: l3-compo-remplir-le-cadre
              specification: >-
                Karl Blossfeldt, Urformen der Kunst, planche 55, 1928 — des crosses de fougère
                agrandies, qui occupent l'image d'un bord à l'autre. Rijksmuseum.
              alt: Six crosses de fougère enroulées en spirale, agrandies, dont les tiges montent du bas de l'image jusqu'en haut
              credit: Karl Blossfeldt, 1928, Rijksmuseum
              priorite: essentiel

      - id: nettoyer
        genre: panneau
        titre: Nettoyer
        claim: Ce qui n'aide pas votre sujet lui nuit.
        colonnes:
          - titre: Les quatre coins
            icone: lucide:scan-eye
            corps: Avant de déclencher, faites le tour des coins — un poteau, une poubelle, un bras coupé.
            image:
              id: l3-compo-quatre-coins
              specification: >-
                Wm. Notman & Son, « Montreal General Hospital, Dorchester Street », vers 1890 — la
                façade est bien cadrée, mais des poteaux et des fils la traversent, et les coins
                s'assombrissent. Musée McCord Stewart.
              alt: Un grand hôpital de pierre vu en angle, des poteaux et des fils électriques devant la façade, les coins de l'image assombris
              credit: Wm. Notman & Son, vers 1890, Musée McCord Stewart
              priorite: essentiel
          - titre: L'arrière-plan d'abord
            icone: lucide:square-dashed
            corps: Choisissez un fond calme, puis placez le sujet devant.
            image:
              id: l3-compo-arriere-plan
              specification: >-
                William Notman, « Child as St. Jean Baptiste », Montréal, 1867 — un enfant devant un
                fond uni et sombre, qui ne lui dispute rien. Musée McCord Stewart.
              alt: Un enfant costumé en saint Jean-Baptiste, vêtu d'une peau de mouton, tenant une croix et une bannière, debout sur un rocher devant un fond gris uni
              credit: William Notman, 1867, Musée McCord Stewart
              priorite: essentiel
        aparte: |
          **Personne ne regarde ses quatre coins naturellement** : tout le monde regarde le
          sujet. C'est pour ça que ce réflexe-là change tout.

      - id: placer
        genre: panneau
        titre: Placer
        claim: Décentré ou centré — franchement. Jamais entre les deux.
        colonnes:
          - titre: Les tiers
            icone: lucide:grid-3x3
            corps: Le sujet sur une ligne, ou à un croisement, de la grille.
            image:
              id: l3-compo-tiers
              specification: >-
                Carleton Watkins, « Cape Horn near Celilo », 1867 — l'arête de la falaise sur la
                ligne verticale du tiers droit. Metropolitan Museum of Art.
              alt: Une voie ferrée longe un fleuve au pied d'une falaise à pic, dont l'arête se dresse aux deux tiers de l'image, sous un grand ciel vide
              credit: Carleton Watkins, 1867, Metropolitan Museum of Art
              priorite: essentiel
          - titre: Le centre assumé
            icone: lucide:focus
            corps: Au milieu, exprès — un portrait de face, un sujet symétrique.
            image:
              id: l3-compo-centre
              specification: >-
                Louis-Prudent Vallée, le monument Wolfe sur les plaines d'Abraham, Québec, vers 1880
                — une colonne seule, exactement au milieu de l'image. Bibliothèque et Archives
                nationales du Québec.
              alt: Une haute colonne de pierre, seule au milieu de l'image, entourée d'une grille de fer, devant quelques maisons basses et un grand ciel pâle
              credit: Louis-Prudent Vallée, vers 1880, Bibliothèque et Archives nationales du Québec
              priorite: essentiel
        aparte: |
          **La règle des tiers est un point de départ, pas une loi.** Smith l'a nommée en 1797,
          pour le dessin. La grille de votre appareil ou de votre téléphone trace les tiers pour
          vous.

      - id: donner-de-la-profondeur
        genre: panneau
        titre: Donner de la profondeur
        claim: Une photo est plate. Donnez-lui une épaisseur.
        colonnes:
          - titre: Le point de vue
            icone: lucide:move-diagonal
            corps: Accroupissez-vous, ou levez l'appareil — la hauteur des yeux est le point de vue le plus banal qui existe.
            image:
              id: l3-compo-accroupi
              specification: >-
                Wm. Notman & Son, le port de Montréal vu de la chapelle Notre-Dame-de-Bon-Secours,
                vers 1900 — le port photographié d'en haut, depuis le clocher. Musée McCord Stewart.
              alt: "Le port de Montréal vu de haut : des bateaux à vapeur le long des quais, des trains et des charrettes, un dôme au premier plan à droite"
              credit: Wm. Notman & Son, vers 1900, Musée McCord Stewart
              priorite: utile
          - titre: Le premier plan
            icone: lucide:layers-2
            corps: Un élément proche, devant, donne la distance de tout le reste.
            image:
              id: l3-compo-premier-plan
              specification: >-
                Alexander Henderson, « Montreal Wharves in Winter », 1872 — des blocs de glace au
                premier plan, les édifices du port derrière. Musée McCord Stewart.
              alt: Des blocs de glace brisée entassés au premier plan, et derrière eux un édifice à tour d'horloge et les bâtiments du port de Montréal
              credit: Alexander Henderson, 1872, Musée McCord Stewart
              priorite: utile

      - id: guider-l-oeil
        genre: panneau
        titre: Guider l'œil
        claim: Menez le regard jusqu'à votre sujet.
        colonnes:
          - titre: Les lignes
            icone: lucide:route
            corps: Une route, une clôture, une rive mènent l'œil au sujet.
            image:
              id: l3-compo-lignes
              specification: >-
                Wm. Notman & Son, « Little Champlain Street, Quebec City », vers 1890 — la rue du
                Petit-Champlain, dont les façades mènent l'œil jusqu'au fond. Musée McCord Stewart.
              alt: Une rue étroite de Québec entre deux rangées de maisons de pierre et de bois qui fuient vers le fond, des enfants au milieu de la rue
              credit: Wm. Notman & Son, vers 1890, Musée McCord Stewart
              priorite: utile
          - titre: Le cadre dans le cadre
            icone: lucide:frame
            corps: Une porte, une fenêtre, une arche entourent le sujet.
            image:
              id: l3-compo-cadre-dans-le-cadre
              specification: >-
                Herbert Ponting, « Grotto in an iceberg », 1911 — un navire et deux hommes vus à
                travers l'ouverture d'une grotte de glace. Alexander Turnbull Library.
              alt: L'ouverture d'une grotte de glace encadre, au loin, un navire à trois mâts et deux hommes debout sur la banquise
              credit: Herbert Ponting, 1911, Alexander Turnbull Library
              priorite: utile

      - id: structurer
        genre: panneau
        titre: Structurer
        claim: Cherchez l'ordre, puis ce qui le brise.
        colonnes:
          - titre: La symétrie
            icone: lucide:flip-horizontal
            corps: Un reflet, une façade — l'axe exactement au centre.
            image:
              id: l3-compo-symetrie
              specification: >-
                Wm. Notman & Son, l'intérieur d'un wagon de première classe du Canadien Pacifique,
                1890 — l'allée centrale exactement au milieu de l'image. Musée McCord Stewart.
              alt: "L'intérieur d'un wagon de train : deux rangées de banquettes de part et d'autre d'une allée centrale, sous un plafond ouvragé et un lustre"
              credit: Wm. Notman & Son, 1890, Musée McCord Stewart
              priorite: utile
          - titre: La répétition
            icone: lucide:repeat
            corps: Des formes qui se répètent, et une seule qui rompt le rythme.
            image:
              id: l3-compo-repetition
              specification: >-
                Alexander Henderson, des raquetteurs sur le mont Royal, 1879 — des silhouettes
                répétées en file sur la pente, et une seule qui s'avance en tête. Musée McCord
                Stewart.
              alt: Une trentaine de raquetteurs en capot, en file sur une pente enneigée entre les arbres ; l'un d'eux s'avance seul en tête, vers l'appareil
              credit: Alexander Henderson, 1879, Musée McCord Stewart
              priorite: utile

      - id: respirer
        genre: panneau
        titre: Respirer
        claim: Le vide et le mouvement font partie de l'image.
        colonnes:
          - titre: L'espace négatif
            icone: lucide:square-dashed
            corps: Beaucoup de vide autour d'un petit sujet le rend plus fort.
            image:
              id: l3-compo-espace-negatif
              specification: >-
                Alexander Henderson, « Spring Inundation near Montreal », 1865 — une petite barque
                seule dans une grande étendue d'eau et de ciel. Musée McCord Stewart.
              alt: Une barque minuscule sur une plaine inondée, entre des arbres nus et leurs reflets, sous un ciel immense et pâle
              credit: Alexander Henderson, 1865, Musée McCord Stewart
              priorite: utile
          - titre: Les diagonales
            icone: lucide:move-diagonal
            corps: Une ligne en biais donne du mouvement ; une horizontale, du calme.
            image:
              id: l3-compo-diagonales
              specification: >-
                William Notman, le pont Victoria en construction, Montréal, vers 1859 — le tube du
                pont traverse l'image en diagonale. Bibliothèque et Archives Canada.
              alt: Le tube de fer du pont Victoria, posé sur des piliers de pierre, monte en diagonale du bas à gauche vers le haut à droite, au-dessus du fleuve
              credit: William Notman, vers 1859, Bibliothèque et Archives Canada
              priorite: utile
          - titre: Le nombre impair
            icone: lucide:dice-3
            corps: Trois éléments s'équilibrent mieux que deux, qui se font concurrence.
            image:
              id: l3-compo-nombre-impair
              specification: >-
                Clarence H. White, « The Ring Toss », 1899 — trois fillettes jouent au lancer
                d'anneaux. Library of Congress.
              alt: Trois fillettes en robe blanche jouent au lancer d'anneaux dans une pièce au plancher de bois, devant une fenêtre aux rideaux clairs
              credit: Clarence H. White, 1899, Library of Congress
              priorite: utile

  # ─────────────────────────────────────────────────────────────────────────
  - id: pause
    titre: Pause et questions
    resume: Une pause, et vos questions — sur la composition ou sur n'importe quoi d'autre.
    ecrans:
      - id: la-pause
        genre: repere
        variante: pause
        titre: Pause et questions
        claim: Dix minutes, et vos questions.
        corps: |
          **Sur la composition, ou sur n'importe quoi d'autre** : matériel, choix d'objectif,
          « pourquoi mes photos ne ressemblent pas à celles d'Instagram ». C'est aussi le moment
          de venir montrer une photo sur votre écran.
        aparte: |
          Les questions auxquelles on ne peut pas répondre en deux minutes deviennent les sujets
          d'atelier de l'année.

  # ─────────────────────────────────────────────────────────────────────────
  # Une ouverture, pas un second cours : moins d'écrans que la composition, et
  # aucun exercice. Les trois intentions titrent les écrans ; les outils sont
  # leurs colonnes. Les photographies sont des emplacements « utile » : celles
  # du club peuvent les remplacer sans toucher à la structure.
  #
  # Droits des archives, vérifiés avant l'ajout (auteur mort avant 1972 ;
  # aux États-Unis, œuvre publiée avant 1929 ou œuvre fédérale) :
  #   Riis († 1914)       1888  Bandits' Roost — Museum of Modern Art (Wikimedia Commons)
  #   Stieglitz († 1946)  1907  The Steerage, publiée dans Camera Work en 1911 (tirage de
  #                             291, 1915) — Metropolitan Museum of Art, accès libre CC0
  #   Emerson († 1936)    1886  Gathering Water-Lilies, publiée en 1886 — Metropolitan Museum
  #                             of Art, accès libre CC0
  #   Hine († 1940)       1908  Sadie Pfeifer — Library of Congress, collection du National
  #                             Child Labor Committee, aucune restriction connue
  #   Lange († 1965)      1936  Migrant Mother — Library of Congress, FSA/OWI : œuvre
  #                             fédérale, sans droit d'auteur aux États-Unis
  #   Atget († 1927)      1926  Rue Laplace et rue Valette — Metropolitan Museum of Art, accès
  #                             libre CC0
  #   Stieglitz († 1946)  1893  Winter, Fifth Avenue, publiée dans Camera Work en 1905 —
  #                             Metropolitan Museum of Art, domaine public
  # Les cartons de musée sont recadrés : seul le tirage est montré. Erwitt,
  # Cartier-Bresson et Crewdson sont protégés : nommés en aparté, jamais montrés.
  - id: au-dela
    titre: Au-delà de la composition
    resume: Captiver, faire ressentir, faire imaginer.
    ecrans:
      - id: ouverture
        genre: repere
        variante: ouverture
        titre: Au-delà de la composition
        claim: Une photo peut être parfaitement composée, et ne rien dire.
        colonnes:
          - titre: Captiver
            icone: lucide:scan-eye
            corps: Donner une raison de s'arrêter.
          - titre: Faire ressentir
            icone: lucide:heart
            corps: Créer une émotion, une atmosphère.
          - titre: Faire imaginer
            icone: lucide:eye-off
            corps: Suggérer ce qui n'est pas dans l'image.

      - id: captiver
        genre: panneau
        titre: Captiver
        claim: Une photo forte arrête celui qui la regarde.
        colonnes:
          - titre: La tension
            icone: lucide:zap
            corps: "Un regard vers nous, un sujet au bord du cadre : l'image est instable."
            image:
              id: l3-au-dela-riis
              specification: >-
                Jacob Riis, « Bandits' Roost », 1888 — une ruelle étroite de New York, des hommes
                appuyés aux murs qui fixent l'objectif. Museum of Modern Art.
              alt: Une ruelle étroite entre deux immeubles, du linge suspendu au-dessus, et une dizaine d'hommes immobiles qui regardent l'appareil
              credit: Jacob Riis, 1888, Museum of Modern Art
              priorite: utile
          - titre: Les relations
            icone: lucide:link
            corps: Deux éléments qui se répondent ou se contredisent. Le sujet, c'est le lien.
            image:
              id: l3-au-dela-stieglitz-steerage
              specification: >-
                Alfred Stieglitz, « The Steerage », 1907 — le pont d'un paquebot coupé en deux par
                une passerelle : les passagers du haut, ceux de l'entrepont en bas. Metropolitan
                Museum of Art.
              alt: Le pont d'un paquebot vu d'en haut, coupé par une passerelle blanche — une foule en chapeaux au-dessus, des passagers serrés en dessous
              credit: Alfred Stieglitz, 1907, Metropolitan Museum of Art
              priorite: utile
        aparte: |
          Un exemple célèbre, qu'on ne peut pas montrer ici : [Elliott Erwitt](https://fr.wikipedia.org/wiki/Elliott_Erwitt),
          *New York City*, 1974 — un petit chien entre les bottes de sa maîtresse et les pattes
          d'un très grand chien.

      - id: faire-ressentir
        genre: panneau
        titre: Faire ressentir
        claim: Une photo n'a pas besoin de raconter pour faire ressentir.
        colonnes:
          - titre: Le calme
            icone: lucide:waves
            corps: Peu d'éléments, une lumière douce, des lignes horizontales.
            image:
              id: l3-au-dela-emerson
              specification: >-
                Peter Henry Emerson, « Gathering Water-Lilies », 1886 — deux personnes dans une
                barque, parmi les nénuphars d'un marais anglais. Metropolitan Museum of Art.
              alt: Une barque glisse sur une eau calme couverte de nénuphars, un homme rame, une femme se penche pour cueillir une fleur
              credit: Peter Henry Emerson, 1886, Metropolitan Museum of Art
              priorite: utile
          - titre: La vulnérabilité
            icone: lucide:user
            corps: Un petit sujet devant quelque chose de très grand.
            image:
              id: l3-au-dela-hine
              specification: >-
                Lewis Hine, « Sadie Pfeifer », 1908 — une fillette à côté d'une longue machine à
                filer qui fuit vers le fond de l'usine. Library of Congress.
              alt: Une fillette en robe longue, debout contre une machine à filer interminable qui traverse toute l'image
              credit: Lewis Hine, 1908, Library of Congress
              priorite: utile
          - titre: L'inquiétude
            icone: lucide:cloud-fog
            corps: Un regard ailleurs, un geste retenu, rien pour rassurer.
            image:
              id: l3-au-dela-lange
              specification: >-
                Dorothea Lange, « Migrant Mother », 1936 — une mère et ses enfants, en gros plan.
                Library of Congress.
              alt: Une femme, la main près de la bouche, regarde au loin ; deux enfants appuyés sur ses épaules lui tournent le visage
              credit: Dorothea Lange, 1936, Library of Congress
              priorite: utile
        ton: regle
        icone: lucide:compass
        encadre: |
          **Pas des formules.** Une photo sombre n'est pas forcément triste. Demandez-vous
          d'abord : **qu'est-ce que je veux faire ressentir ?**

      - id: faire-imaginer
        genre: panneau
        titre: Faire imaginer
        claim: Ce que la photo ne montre pas, celui qui la regarde l'invente.
        colonnes:
          - titre: Ce qu'on ne montre pas
            icone: lucide:door-open
            corps: Assez d'indices pour imaginer, pas assez pour savoir.
            image:
              id: l3-au-dela-atget
              specification: >-
                Eugène Atget, rue Laplace et rue Valette, Paris, 1926 — une rue vide qui se sépare
                en deux et tourne hors de vue. Metropolitan Museum of Art.
              alt: Une rue pavée de Paris, déserte, qui se divise en deux autour d'un vieil immeuble et disparaît dans un virage
              credit: Eugène Atget, 1926, Metropolitan Museum of Art
              priorite: utile
          - titre: L'avant et l'après
            icone: lucide:hourglass
            corps: "Un geste pas fini : on devine la suite."
            image:
              id: l3-au-dela-stieglitz-hiver
              specification: >-
                Alfred Stieglitz, « Winter, Fifth Avenue », 1893 — une diligence qui avance vers
                nous dans une tempête de neige. Metropolitan Museum of Art.
              alt: Une diligence tirée par des chevaux avance dans une avenue enneigée, sous une neige qui efface les immeubles
              credit: Alfred Stieglitz, 1893, Metropolitan Museum of Art
              priorite: utile
        aparte: |
          Stieglitz a attendu trois heures dans la tempête pour ce moment.
          [Henri Cartier-Bresson](https://fr.wikipedia.org/wiki/Henri_Cartier-Bresson)
          l'appellera « l'instant décisif » (*Derrière la gare Saint-Lazare*, 1932).
          [Gregory Crewdson](https://fr.wikipedia.org/wiki/Gregory_Crewdson) met en scène des
          histoires qui ne finissent jamais.

      - id: pourquoi
        genre: repere
        variante: transition
        titre: Pourquoi
        claim: Avant de vous demander comment composer votre photo, demandez-vous pourquoi vous voulez la prendre.
        colonnes:
          - titre: Composer
            icone: lucide:frame
            corps: Où va le regard ?
          - titre: Choisir
            icone: lucide:message-circle-question
            corps: Qu'est-ce que je veux dire ?
          - titre: Toucher
            icone: lucide:hand-heart
            corps: Que va ressentir ou imaginer celui qui regarde ?

  # ─────────────────────────────────────────────────────────────────────────
  # Un bloc partagé : l'animateur ouvre, puis des photographes du club racontent
  # leur pratique. L'énoncé de « Pourquoi, et pour qui » reste un conseil aux
  # participants, le corps parle à la première personne ; la séance se termine
  # sur la discussion, sans autre bloc après.
  - id: apprentissages
    titre: Ce que la pratique nous apprend
    resume: Aimer ses photos, puis progresser — des photographes du club racontent.
    ecrans:
      - id: ouverture
        genre: repere
        variante: ouverture
        titre: Ce que la pratique nous apprend
        claim: Prenez ce qui vous sert. C'est une pratique, pas une règle.
        corps: |
          **Jean-Pierre Bluteau**, animateur de la formation « Premiers clics », commence. Puis des
          photographes du club racontent ce qu'ils ont appris en photographiant, en se trompant et
          en montrant leurs photos.

      - id: pourquoi-pour-qui
        genre: panneau
        titre: Pourquoi, et pour qui
        claim: Aimez vos photos d'abord. Puis demandez-vous pour qui vous les faites.
        corps: |
          Je photographie d'abord pour moi. Une photo que j'aime, je la regarde encore des années
          plus tard ; une photo faite pour plaire, je l'oublie dès qu'elle a fait le tour.

          Avant de déclencher, je me demande **pour qui** est cette image : pour moi, pour ma
          famille, pour un mur, pour le club. La réponse change ce que je garde, comment je la
          développe et où je la montre.

          Les avis des autres m'apprennent beaucoup. Mais ils viennent **après** : si je n'aime
          pas ma photo, aucun compliment ne la sauve.

      - id: progresser
        genre: repere
        variante: cloture
        titre: Progresser, et continuer d'aimer ça
        claim: Comment devient-on meilleur photographe, sans perdre le plaisir ?
        corps: |
          Des photographes du club racontent leur parcours.

          - **Qu'est-ce qui vous a fait progresser le plus ?** Une personne, un livre, une
            contrainte, une erreur.
          - **Quel moment vous a fait passer un cap ?**
          - **Qu'auriez-vous aimé savoir à vos débuts ?**
          - **Quand l'envie baisse, qu'est-ce qui vous ramène à la photo ?**
