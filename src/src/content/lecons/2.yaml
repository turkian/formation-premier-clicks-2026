# Séance 2 — adaptée du carnet de production de l'animateur (historique git),
# selon la même règle que la séance 1 (décision D7) : les blocs de citation
# deviennent le texte à l'écran, les tableaux deviennent du contenu, les
# directives destinées à la salle sont affichées, et tout ce qui relève du
# minutage, de l'équipe, du matériel ou des consignes d'animation — y compris
# les fiches d'ateliers, qui sont un outil d'animateur — n'est pas repris ici.

numero: 2
titre: L'exposition
filConducteur: La durée → la sensibilité → plus clair ou plus sombre
question: qu'est-ce que mon appareil décide à ma place, et pourquoi ?
pret: false

blocs:
  # ─────────────────────────────────────────────────────────────────────────
  - id: retour
    titre: Retour sur la séance 1
    resume: Vos photos d'abord, puis une seule histoire — de la lumière à l'ouverture.
    ecrans:
      - id: bilan
        genre: repere
        variante: ouverture
        titre: Retour
        claim: Avez-vous pris des photos depuis la séance 1 ? Qu'avez-vous appris ?
        corps: |
          Une photo réussie, une photo ratée, ou seulement quelque chose que vous avez remarqué
          en regardant autour de vous : **tout compte**.

      - id: rappel-budget
        genre: panneau
        titre: L'ouverture et la lumière
        claim: L'ouverture, c'est le trou par lequel la lumière entre dans votre appareil.
        corps: |
          Plus l'ouverture est **grande**, plus il entre de lumière ; plus elle est **petite**,
          moins il en entre.
        disposition: empilee
        schema:
          composant: diametre-ouverture
          props:
            mode: lumiere
            focale: 50
            ouvertures: [2.8, 4, 5.6, 8]
            photos: [l2-lumiere-f2-8, l2-lumiere-f4, l2-lumiere-f5-6, l2-lumiere-f8]
          legende: Simulation — la même photo, avec la lumière que laisse entrer chaque trou.

      - id: un-prix
        genre: panneau
        titre: La profondeur de champ
        claim: L'ouverture change aussi la profondeur de champ.
        corps: |
          Devant et derrière votre sujet, une partie de l'image reste nette : c'est la
          **profondeur de champ**. Hors de cette zone, l'image devient de plus en plus floue.

          - **un grand trou** — une zone **mince** ;
          - **un petit trou** — une zone **épaisse**.
        schema:
          composant: zone-nette
          props:
            arrierePlan: true
        icone: lucide:sliders-horizontal
        encadre: |
          L'ouverture est un levier important : elle règle à la fois **la luminosité** de
          votre photo et **son rendu**.

      - id: rappel-mise-au-point
        genre: panneau
        titre: La mise au point
        claim: La mise au point choisit *où* l'image est nette.
        corps: |
          - **`AF-S`** — le sujet ne bouge pas : le point est fait, puis verrouillé.
          - **`AF-C`** — le sujet bouge : l'appareil corrige en continu.

          **La distance compte aussi** : plus le point est proche, plus la zone nette est
          mince. Même objectif, même ouverture : environ **8 cm** à 1 mètre, **près de dix fois
          plus** à 3 mètres.
        schema:
          composant: distance-sujet
          props:
            distances: [1, 3]
            zones: true
          legende: Un 50 mm à f/5.6 — seule la distance change.
        aparte: |
          Les mots changent selon la marque : `AF-S` se dit aussi *One Shot*, et `AF-C`,
          *AI Servo*.

      - id: rappel-leviers
        genre: panneau
        titre: Les quatre leviers
        claim: Construisez votre image avec quatre leviers, dans cet ordre.
        corps: |
          De la scène vers le réglage :

          | | Comment | Pour un fond plus flou |
          |---|---|---|
          | **1 · Le fond** | les pieds de votre sujet | éloignez le sujet du fond |
          | **2 · Votre distance** | vos pieds | rapprochez-vous du sujet |
          | **3 · La focale** | votre zoom | zoomez |
          | **4 · L'ouverture** | le réglage | ouvrez — un petit chiffre `f` |

          Pour un fond net, faites l'inverse.
        aparte: |
          L'ouverture vient en dernier : c'est le seul levier qui change aussi la lumière.

      - id: deux-nouveaux-leviers
        genre: repere
        variante: transition
        titre: Deux nouveaux leviers
        claim: "Deux nouveaux leviers : la vitesse et l'ISO."
        colonnes:
          - titre: La vitesse
            icone: lucide:timer
            corps: |
              **Combien de temps** la lumière entre.

              Elle fige ce qui bouge, ou le laisse voir.
          - titre: L'ISO
            icone: lucide:sun-medium
            corps: |
              **La sensibilité** de votre appareil à la lumière.

              Il éclaircit l'image quand la lumière manque.

  # ─────────────────────────────────────────────────────────────────────────
  - id: vitesse
    titre: Le mouvement et la vitesse
    resume: Figer, ou laisser voir. Aucune des deux n'est meilleure.
    ecrans:
      - id: l-obturateur
        genre: interactif
        titre: L'obturateur
        claim: Un rideau découvre le capteur, un second le recouvre. La vitesse, c'est le temps entre les deux.
        composant: obturateur
        aparte: |
          Un obturateur électronique n'a aucun rideau : le capteur est lu ligne par ligne, avec un
          résultat semblable.

      - id: la-molette-de-vitesse
        genre: appareil-en-main
        titre: Appareil en main — la vitesse
        claim: Photographiez la main de votre voisin qui s'agite, à 1/500 puis à 1/15.
        gestes:
          - "**Passez en mode `S`** — ou **`Tv`** sur un Canon."
          - "**Trouvez la molette de vitesse.** Allez de `1/1000` à `1/15` en regardant le chiffre changer."
          - "**Votre voisin agite la main** devant vous : photographiez-la à `1/500`, puis à `1/15`."
          - "**Comparez** les deux photos sur votre écran."
        cellulaire: |
          Cherchez un mode **`Pro`** ou **`Expert`** dans votre application appareil photo.
          Sinon, observez : votre téléphone choisit une vitesse lente quand il fait sombre, et
          c'est pour ça que vos photos de soirée sont floues.
        aparte: |
          Les modes sont en **section 1** de votre feuille de marque. Le reste de vos réglages
          ne bouge pas.

      - id: la-decision
        genre: panneau
        titre: La décision
        claim: Face à quelque chose qui bouge, vous avez deux choix. Aucun n'est meilleur.
        colonnes:
          - titre: Figer
            icone: lucide:snowflake
            corps: On lit le détail, l'instant est suspendu.
            image:
              id: l2-figer
              specification: Une action figée net — un enfant qui saute, des gouttes d'eau suspendues · 1/1000 s
              priorite: utile
          - titre: Laisser voir le mouvement
            icone: lucide:wind
            corps: On lit la vitesse, l'énergie.
            image:
              id: l2-laisser-voir
              specification: Un mouvement visible — une rivière soyeuse, ou un cycliste filé sur un fond étiré · 1/4 s
              priorite: utile

      - id: trois-vitesses
        genre: demonstration
        titre: Une scène, trois vitesses
        claim: La même rue, trois vitesses. Entre figer et laisser voir, il y a tout un éventail.
        series:
          - variable: la vitesse — l'appareil ajuste l'ISO
            constantes:
              scène: la même rue
              cadrage: le même
              ouverture: f/8
              appareil: sur trépied
            legende: Regardez les passants, puis le décor.
            images:
              - id: l2-rue-1-500
                specification: Rue animée en fin de journée, passants et voitures · 1/500 s · f/8 · trépied · tout est figé
                valeur: 1/500 s — tout est figé
                priorite: essentiel
                reglages: { vitesse: 1/500 s, ouverture: f/8 }
              - id: l2-rue-1-30
                specification: Même rue, même cadrage · 1/30 s · f/8 · trépied · les passants commencent à filer, le décor reste net
                valeur: 1/30 s — les passants commencent à filer
                priorite: essentiel
                reglages: { vitesse: 1/30 s, ouverture: f/8 }
              - id: l2-rue-1-2
                specification: Même rue, même cadrage · 1/2 s · f/8 · trépied · passants et voitures en traînées, décor net
                valeur: 1/2 s — le mouvement devient des traînées
                priorite: essentiel
                reglages: { vitesse: 1/2 s, ouverture: f/8 }

      - id: points-de-depart
        genre: panneau
        titre: Des points de départ
        claim: Des points de départ, pas des règles.
        cartes:
          - titre: Figer
            icone: lucide:snowflake
            elements:
              - { titre: Un oiseau en vol, valeur: 1/2000 s, icone: lucide:bird }
              - { titre: Du sport, valeur: 1/1000 s, icone: lucide:volleyball }
              - { titre: Un enfant qui court, valeur: 1/500 s, icone: lucide:person-standing }
              - { titre: Une personne qui marche, valeur: 1/250 s, icone: lucide:footprints }
          - titre: Entre les deux
            icone: lucide:arrow-left-right
            elements:
              - { titre: "Un musicien, une danseuse", valeur: 1/60 s, icone: lucide:music }
              - { titre: Des passants dans la rue, valeur: 1/30 s, icone: lucide:users }
              - { titre: Une cascade qui garde sa texture, valeur: 1/15 s, note: appareil appuyé, icone: lucide:mountain }
              - { titre: Des vagues sur les rochers, valeur: 1/8 s, note: sur trépied, icone: lucide:sailboat }
          - titre: Laisser voir le mouvement
            icone: lucide:wind
            elements:
              - { titre: Un filé — suivre un sujet qui passe, valeur: 1/30 s, icone: lucide:bike }
              - { titre: Une rivière soyeuse, valeur: 1/4 s à 1 s, note: sur trépied, icone: lucide:waves }
              - { titre: Des feux d'artifice, valeur: 2 à 4 s, note: sur trépied, icone: lucide:sparkles }
              - { titre: Les phares des voitures, valeur: 10 à 30 s, note: sur trépied, icone: lucide:car-front }

      - id: deux-flous
        genre: panneau
        titre: Deux flous, deux causes
        claim: Le sujet a bougé, ou c'est vous. Savoir lequel, c'est savoir quoi corriger.
        corps: |
          | Ce que vous voyez | Qui a bougé | Ce qu'on fait |
          |---|---|---|
          | Seul le sujet est flou, **le décor est net** | le sujet | montez la vitesse, ou passez en `AF-C` |
          | **Toute l'image** est floue, dans le même sens | vous | montez la vitesse, calez vos coudes |
        encadre: |
          **À main levée, la règle du pouce : au moins `1/focale`.** À 50 mm, `1/50 s` ; à
          200 mm, `1/200 s`. Plus lent, appuyez-vous, ou posez l'appareil sur un trépied.
        ton: regle
        icone: lucide:ruler
        aparte: |
          Le trépied supprime votre bougé, jamais celui du sujet. La stabilisation du boîtier ou
          de l'objectif vous laisse descendre plus lent. Sur un capteur APS-C, comptez la focale
          × 1,5 : à 50 mm, `1/80 s`.

      - id: deux-flous-en-images
        genre: demonstration
        titre: Les deux flous, en images
        claim: Un sujet flou sur un décor net. Une image entièrement floue. Ce n'est pas le même flou.
        images:
          - id: l2-sujet-bouge
            specification: Sujet en mouvement, décor net · vitesse insuffisante pour le figer
            valeur: c'est le sujet qui a bougé — le décor est net
            priorite: essentiel
          - id: l1-bouge
            specification: Toute l'image floue dans le même sens · 1/8 s à main levée
            valeur: c'est la main qui a bougé — tout est flou
            priorite: essentiel

      - id: le-flou-choisi
        genre: demonstration
        titre: Le flou choisi
        claim: Les mêmes flous que tout à l'heure — mais voulus.
        images:
          - id: l2-trainees
            specification: Traînées de lumière dessinées dans l'air avec une lampe de poche, appareil posé · pose de 1 à 2 s
            valeur: la lumière bouge, l'appareil est immobile
            priorite: essentiel
          - id: l2-icm
            specification: Flou volontaire — l'appareil balayé de haut en bas pendant la pose, sur des arbres ou des lumières · 1/4 à 1/2 s
            valeur: l'appareil bouge, la scène est immobile
            priorite: essentiel
          - id: l2-file
            specification: Filé — un cycliste net sur un fond étiré, l'appareil suit le sujet pendant la pose · 1/30 s
            valeur: l'appareil suit le sujet — lui est net, le fond file
            priorite: utile

      - id: les-trainees
        genre: appareil-en-main
        titre: Appareil en main — les traînées de lumière
        claim: Le sujet bouge — cette fois, exprès. On tamise les lumières, et on dessine avec une lampe.
        gestes:
          - "**Passez en mode `S`** — ou **`Tv`** sur un Canon — et choisissez **`1 s`**."
          - "**Posez l'appareil** sur la table ou sur un sac : il ne doit pas bouger."
          - "**Activez le retardateur de 2 secondes**, pour que votre doigt ne fasse pas trembler l'appareil."
          - "**Pendant la pose, votre voisin dessine une forme dans l'air** avec la lampe de son téléphone. Puis essayez `2 s`."
        cellulaire: |
          Sur un iPhone, prenez une **Live Photo**, puis choisissez l'effet **Pose longue**. Sur
          Android, cherchez un mode **pose longue** ou **light painting**, ou le mode **`Pro`**
          avec une vitesse lente.
        aparte: |
          Dans une salle trop éclairée, la photo serait toute blanche : c'est pour ça qu'on
          tamise.

      - id: le-flou-voulu
        genre: appareil-en-main
        titre: Appareil en main — le flou voulu
        claim: C'est vous qui bougez — cette fois, exprès. Bougez l'appareil pendant la photo.
        gestes:
          - "**Passez en mode `S`** — ou **`Tv`** sur un Canon — et choisissez **`1/4 s`**."
          - "**Visez quelque chose de coloré** : les lumières du plafond, une étagère, un manteau."
          - "**Commencez à bouger l'appareil, puis appuyez**, et continuez le geste jusqu'à la fin de la pose. Essayez d'abord de haut en bas."
          - "**Recommencez à `1/2 s`**, et comparez."
        cellulaire: |
          Le mode **`Pro`** avec une vitesse lente, ou une **Live Photo** en **Pose longue**, en
          bougeant le téléphone pendant la prise.
        aparte: |
          Ni trépied ni appui : c'est le mouvement de vos mains qui fait l'image.

  # ─────────────────────────────────────────────────────────────────────────
  - id: iso
    titre: L'ISO, le bouton du volume
    resume: "Il n'ajoute pas de lumière : il monte le son."
    ecrans:
      - id: qu-est-ce-que-l-iso
        genre: panneau
        titre: Qu'est-ce que l'ISO ?
        claim: "L'ISO est un chiffre hérité de la pellicule : il dit combien de lumière il faut pour une image bien exposée."
        colonnes:
          - titre: Une pellicule lente — 100 ISO
            icone: lucide:sun
            corps: Petits cristaux, il faut beaucoup de lumière. Pour le grand soleil. L'image est fine.
          - titre: Une pellicule rapide — 400, 1600 ISO
            icone: lucide:moon
            corps: Gros cristaux, moins de lumière suffit. Pour l'intérieur, la nuit. Le grain se voit.
        aparte: |
          On changeait d'ISO en changeant de pellicule — pour 24 ou 36 photos. Avant l'ISO, ce
          chiffre s'appelait ASA.

      - id: l-iso-aujourd-hui
        genre: interactif
        titre: L'ISO aujourd'hui
        claim: "La lumière devient un signal, l'ISO l'amplifie, puis il devient des nombres. L'ISO, c'est le volume."
        composant: chaine-du-capteur
        aparte: |
          Le mot « sensibilité » vient de la pellicule. Votre capteur, lui, n'en a qu'une : l'ISO
          règle seulement l'amplification.

      - id: l-iso-eclaircit
        genre: appareil-en-main
        titre: Appareil en main — l'ISO éclaircit
        claim: "Même ouverture, même vitesse. Seul l'ISO change : regardez la photo s'éclaircir."
        gestes:
          - "**Passez en mode `M`.** Réglez **`f/5.6`** et **`1/125`**."
          - "**Coupez l'ISO auto, et réglez `100`.** Photographiez la salle."
          - "**Même photo à `800`, puis à `6400`.** Comparez les trois."
          - "**Remettez l'ISO auto.**"
        cellulaire: |
          Dans le mode **`Pro`** ou manuel, glissez l'ISO au plus bas, puis au plus haut. Fixez
          la vitesse si l'application le permet.
        aparte: |
          L'ISO auto est en **section 3** de votre feuille de marque. Le mode `M` sert ici à tout
          figer sauf l'ISO ; on le présente après la pause.

      - id: le-raisonnement
        genre: panneau
        titre: Le raisonnement
        claim: "L'ISO n'est pas une décision créative : il vient en dernier."
        corps: |
          **Un match de basket, au gymnase.** Par où commencez-vous ? Par ce que vous voulez
          montrer.
        colonnes:
          - titre: La zone nette d'abord
            icone: lucide:aperture
            corps: |
              1. **L'ouverture** → `f/4`, votre enfant détaché des gradins.
              2. **La vitesse** → `1/500 s`, le saut figé.
          - titre: Le mouvement d'abord
            icone: lucide:timer
            corps: |
              1. **La vitesse** → `1/500 s`, le saut figé.
              2. **L'ouverture** → `f/4`, le plus de lumière possible.
        ton: regle
        icone: lucide:ruler
        encadre: |
          **3 · Puis l'ISO, en dernier, pour ajuster l'exposition.** Vos deux choix sont faits,
          mais la photo sort trop sombre : montez l'ISO jusqu'à ce qu'elle soit bien exposée —
          ici, vers `3200`.
        aparte: |
          Partez de la photo que vous voulez, pas du réglage.

      - id: d-ou-vient-le-bruit
        genre: panneau
        titre: D'où vient le bruit
        claim: Le grain de la pellicule venait de l'ISO. Le bruit numérique vient du manque de lumière.
        corps: |
          Quelqu'un chuchote. Montez le volume : vous entendez le chuchotement — et le souffle.
          **Le souffle était là.** Baissez le volume : il ne part pas, vous n'entendez plus rien.

          Votre photo, c'est pareil : **le bruit est dans la lumière captée**, et l'ISO le rend
          visible.
        ton: regle
        icone: lucide:ruler
        encadre: |
          **Le meilleur ISO est celui qui expose correctement votre sujet.** Ne sous-exposez
          jamais pour éviter le bruit.

      - id: le-bruit-dans-l-ombre
        genre: appareil-en-main
        titre: Appareil en main — le bruit dans l'ombre
        claim: Une seule photo, un seul ISO. Cherchez où se cache le bruit.
        gestes:
          - "**Restez en mode `A`** — ou **`Av`** sur un Canon — avec l'ISO auto."
          - "**Cadrez une lampe ou une fenêtre, et un coin sombre.** Photographiez."
          - "**Lisez l'ISO** de la photo sur votre écran."
          - "**Zoomez dans le coin sombre**, puis dans la partie éclairée. Comparez."
        cellulaire: |
          Même photo, puis zoomez. Le téléphone lisse le bruit, mais c'est dans l'ombre que les
          détails disparaissent d'abord.
        aparte: |
          Même photo, même ISO : le bruit vit dans l'ombre, là où la lumière a manqué.

      - id: nette-ou-propre
        genre: demonstration
        titre: Même lumière, trois issues
        claim: La même scène, la même lumière. Trois façons d'obtenir une image claire.
        series:
          - variable: comment on obtient la luminosité
            constantes:
              lieu: une pièce peu éclairée
              mode: M
              ouverture: f/5.6
            legende: |
              La troisième est propre parce qu'elle a capté seize fois plus de lumière, pas parce
              que son ISO est bas. Cette lumière est venue d'une vitesse lente : d'où le flou.
            images:
              - id: l2-iso-nette-bruitee
                specification: Pièce peu éclairée · M · f/5.6 · 1/125 s · ISO 6400 · bien exposée
                valeur: ISO 6400 — nette, bruitée
                priorite: essentiel
                reglages: { iso: "6400", ouverture: f/5.6 }
              - id: l2-iso-eclaircie
                specification: Même cadrage · 1/125 s · ISO 400 · la photo sort sombre, puis on l'éclaircit après coup, au téléphone ou à l'ordinateur
                valeur: ISO 400, éclaircie — plus bruitée
                priorite: essentiel
                reglages: { iso: "400", ouverture: f/5.6 }
              - id: l2-iso-propre-floue
                specification: Même cadrage · 1/8 s à main levée · ISO 400 · bien exposée, mais bougée
                valeur: ISO 400 à 1/8 s — floue
                priorite: essentiel
                reglages: { iso: "400", ouverture: f/5.6 }

      - id: m-et-iso-auto
        genre: panneau
        titre: M et l'ISO auto
        claim: "En `M` avec l'ISO auto, vous fixez l'ouverture et la vitesse. L'appareil règle le volume."
        corps: |
          Le raisonnement de tout à l'heure, automatisé :

          1. **`f/4`** pour la profondeur de champ — vous.
          2. **`1/500 s`** pour figer — vous.
          3. L'ISO qui expose bien — **l'appareil**.

          C'est le mode du jour où l'ouverture **et** la vitesse comptent. Votre point de départ
          reste **`A` · `Av`**.
        ton: regle
        icone: lucide:sun-moon
        encadre: |
          **Plus clair ou plus sombre ? Le bouton `+/−`.** C'est la compensation d'exposition :
          « un peu plus clair » ou « un peu plus sombre » que ce que l'appareil a choisi. En `M`
          avec l'ISO auto, elle déplace l'ISO.
        aparte: |
          L'ISO auto, sa limite haute — 3200 ou 6400 — et le bouton `+/−` sont en **section 3**
          de votre feuille de marque.

  # ─────────────────────────────────────────────────────────────────────────
  - id: repartir
    titre: Plus clair ou plus sombre, et votre défi
    resume: Le bouton +/− au quotidien, et cinq photos à faire.
    ecrans:
      - id: plus-clair-plus-sombre
        genre: panneau
        titre: Plus clair ou plus sombre
        claim: "Le réglage à toucher : la compensation d'exposition, le bouton `+/−`."
        cartes:
          - titre: Vers le +
            icone: lucide:sun
            elements:
              - { titre: "Neige, plage", valeur: "+1", note: "sinon, elle sort grise", icone: lucide:snowflake }
              - { titre: "Un mur blanc, une robe blanche", valeur: "+1", note: "sinon, il sort gris", icone: lucide:square }
              - { titre: Un contre-jour, valeur: "+1 à +2", note: "sinon, le sujet devient une silhouette", icone: lucide:user-round }
          - titre: Vers le −
            icone: lucide:moon
            elements:
              - { titre: "Un spectacle, une scène sombre", valeur: "−1", note: "sinon, les noirs sortent gris", icone: lucide:drama }
              - { titre: Un sujet sur fond noir, valeur: "−1", note: "sinon, il sort trop clair", icone: lucide:circle }
              - { titre: Un coucher de soleil, valeur: "−1", note: "pour garder ses couleurs", icone: lucide:sunset }
        ton: regle
        icone: lucide:sun-moon
        encadre: |
          **Trop sombre → vers le `+`. Trop clair → vers le `−`.** L'appareil vise une scène moyenne.
        aparte: |
          Le `+/−` : **section 3** de votre feuille de marque. Au téléphone, touchez l'écran et glissez.

      - id: le-defi
        genre: panneau
        titre: Le défi
        claim: Cinq photos. Cinq exercices.
        corps: |
          - Une photo qui **fige** un mouvement
          - Une photo qui **laisse voir** le mouvement — traînées de lumière ou flou voulu
          - Une photo en **faible lumière**, en laissant l'ISO monter
          - Une photo **corrigée avec le `+/−`** — neige, contre-jour ou scène sombre
          - Une photo en **`M` avec l'ISO auto**

          **Si elles sont ratées, elles sont encore plus utiles.**

      - id: derniere-question
        genre: repere
        variante: cloture
        titre: La question de fin
        claim: Votre photo est floue, ou trop sombre. Qui sait maintenant quoi faire ?
        corps: |
          À main levée, et il n'y a pas de mauvaise réponse.
