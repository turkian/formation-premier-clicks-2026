# Séance 1 — adaptée de docs/Session 1/formation_photo_session_1.md.
#
# Règle d'adaptation appliquée partout (décision D7) :
#   — les blocs de citation, déjà écrits en « vous », deviennent le texte à l'écran ;
#   — les tableaux deviennent du contenu d'écran ;
#   — les directives destinées à la salle (« à main levée, personne n'est nommé »)
#     sont affichées : les participants doivent les lire aussi ;
#   — le minutage, l'équipe, le matériel et le rythme de l'animateur restent
#     dans docs/ et n'apparaissent nulle part ici.
#
# Aucun écran ne s'adresse à l'animateur.

numero: 1
titre: La lumière et la netteté
filConducteur: Lumière → où est le point net → quelle épaisseur est nette
question: qu'est-ce qui est net dans mon image, et pourquoi ?

blocs:
  # ─────────────────────────────────────────────────────────────────────────
  - id: accueil
    titre: Bienvenue
    resume: Ce que cette formation est, et ce qu'elle n'est pas.
    ecrans:
      - id: bienvenue
        genre: repere
        variante: ouverture
        titre: Bienvenue
        claim: Il n'y a aucune question bête ici.
        corps: |
          - **Cette formation ne porte pas sur votre appareil.** Elle porte sur les décisions à
            prendre. Les boutons changent d'un modèle à l'autre ; les décisions sont les mêmes
            depuis cent ans.
          - **Un cellulaire est un appareil photo.** Si c'est ce que vous avez, vous êtes
            exactement au bon endroit. La majorité de ce qu'on va voir s'y applique.
          - La photo est pleine de vocabulaire inutilement compliqué. **Si un mot n'est pas
            clair, arrêtez-moi.**

      - id: tour-de-table
        genre: repere
        variante: activite
        titre: Tour de table
        claim: Présentez-vous aux gens de votre table.
        corps: |
          Avec les gens de votre table :

          1. votre **prénom** ;
          2. **quel appareil** vous avez ;
          3. **ce qui est le plus frustrant ou le plus difficile pour vous, en photo** — pas
             seulement avec votre appareil.

          Une feuille est sur votre table : notez-y votre réponse à la troisième question.

      - id: avant-chaque-photo
        genre: panneau
        titre: Les quatre questions
        claim: Avant chaque photo, quatre questions.
        corps: |
          1. **Qu'est-ce que je veux montrer ?**
          2. **Qu'est-ce qui doit être net ?**
          3. **Comment est-ce que je veux représenter le mouvement ?**
          4. **Quelle lumière ai-je à ma disposition ?**
        ton: avertissement
        icone: lucide:triangle-alert
        encadre: |
          En mode automatique, l'appareil répond à ces quatre questions **à votre place**, et il y
          répond mal — parce qu'il ne sait pas ce que vous voulez montrer.
        suite: |
          Sortir du mode automatique, c'est **reprendre ces quatre décisions**.

  # ─────────────────────────────────────────────────────────────────────────
  - id: lumiere
    titre: Comprendre la lumière
    resume: La matière première, avant tout réglage.
    ecrans:
      - id: la-matiere-premiere
        genre: panneau
        titre: La lumière
        claim: La lumière limite vos choix. Elle ne les dicte pas.
        corps: |
          | | |
          |---|---|
          | **Quantité** | Beaucoup ou peu. Elle **limite** — elle ne décide pas. |
          | **Direction** | Frontale, latérale, contre-jour, du dessus. |
          | **Qualité** | Dure ou douce. **La taille apparente de la source décide de tout.** |
          | **Couleur** | Chaude ou froide. Votre appareil essaie de la deviner, et se trompe parfois. |
        schema:
          composant: direction-lumiere

      - id: la-lumiere-en-images
        genre: demonstration
        titre: La lumière, en images
        claim: Aucun réglage n'a changé d'une image à l'autre.
        series:
          - variable: la direction de la lumière
            constantes:
              sujet: le même
              réglages: identiques
              objectif: 50 mm
            legende: Quatre positions autour d'une source lumineuse.
            images:
              - id: l1-lum-frontale
                specification: Sujet devant la source lumineuse, lumière frontale · 50 mm · f/5.6
                valeur: frontale
                priorite: utile
                reglages: { direction: frontale, focale: 50 mm, ouverture: f/5.6 }
              - id: l1-lum-laterale
                specification: Sujet de côté par rapport à la source lumineuse · 50 mm · f/5.6
                valeur: latérale
                priorite: utile
                reglages: { direction: latérale, focale: 50 mm, ouverture: f/5.6 }
              - id: l1-lum-contre-jour
                specification: Sujet dos à la source lumineuse, en contre-jour · 50 mm · f/5.6
                valeur: contre-jour
                priorite: utile
                reglages: { direction: contre-jour, focale: 50 mm, ouverture: f/5.6 }
              - id: l1-lum-dessus
                specification: Sujet éclairé du dessus · 50 mm · f/5.6
                valeur: du dessus
                priorite: utile
                reglages: { direction: du dessus, focale: 50 mm, ouverture: f/5.6 }
          - variable: la qualité de la lumière
            constantes:
              sujet: le même
              direction: latérale
            legende: Une petite source, puis une grande.
            images:
              - id: l1-qualite-dure
                specification: Même sujet, source ponctuelle — ombres tranchées
                valeur: source petite, lumière dure
                priorite: utile
                reglages: { source: petite, direction: latérale }
              - id: l1-qualite-douce
                specification: Même sujet, ciel couvert ou grande fenêtre — ombres douces
                valeur: source grande, lumière douce
                priorite: utile
                reglages: { source: grande, direction: latérale }


      - id: la-couleur-de-la-lumiere
        genre: demonstration
        titre: La couleur de la lumière
        claim: Votre appareil essaie de deviner la couleur du blanc. Parfois il se trompe.
        series:
          - variable: la couleur de la lumière
            constantes:
              sujet: le même
              balance des blancs: automatique
            legende: En RAW, cette couleur se corrige au développement sans aucune perte.
            images:
              - id: l1-couleur-chaude
                specification: Même sujet sous une ampoule domestique · balance des blancs automatique
                valeur: lumière chaude
                priorite: complement
                reglages: { lumière: chaude, balance: automatique }
              - id: l1-couleur-froide
                specification: Même sujet à l'ombre en plein jour · balance des blancs automatique
                valeur: lumière froide
                priorite: complement
                reglages: { lumière: froide, balance: automatique }

      - id: deux-pas-de-cote
        genre: appareil-en-main
        titre: Appareil en main — la lumière
        claim: Prenez deux photos du même objet, en vous déplaçant pour que la lumière vienne d'un côté différent.
        gestes:
          - Choisissez un objet sur votre table.
          - Photographiez-le tel qu'il est.
          - "**Déplacez-vous de deux pas**, pour que la lumière l'atteigne d'un autre côté, et refaites la photo."
          - Comparez les deux sur votre écran.
        cellulaire: Exactement le même exercice. Vous n'avez aucun réglage à toucher.

  # ─────────────────────────────────────────────────────────────────────────
  - id: mise-au-point
    titre: Ce qui est net — la mise au point
    resume: Où l'appareil fait le point, et comment le lui dire.
    ecrans:
      - id: ouverture
        genre: repere
        variante: ouverture
        titre: La mise au point
        claim: Où est le point net ?
        corps: |
          Deux mots se ressemblent. Avant qu'on les définisse, que changent-ils, chacun,
          selon vous ?
        termes:
          - La mise au point
          - La profondeur de champ

      - id: point-ou-zone
        genre: panneau
        titre: Mise au point ou profondeur de champ
        claim: La mise au point, c'est *où*. La profondeur de champ, c'est *quelle épaisseur*.
        corps: |
          - **La mise au point** — ce qu'on appelle souvent « faire le focus » — c'est **où**
            l'appareil fait le point. **Un seul endroit.**
          - **La profondeur de champ**, c'est **l'épaisseur** de la zone qui paraît nette autour
            de cet endroit.
        schema:
          composant: point-et-zone
        icone: lucide:focus
        encadre: |
          Ce que fait réellement l'autofocus : il fait le point sur **ce que vous lui désignez**.
          Si vous ne désignez rien, il choisit tout seul — généralement ce qui est le plus près,
          ou le plus contrasté.

      - id: autofocus
        genre: panneau
        titre: Les modes autofocus
        claim: Ça bouge ? AF-C. Ça ne bouge pas ? AF-S.
        corps: |
          | Mode | Quand | Ce qu'il fait |
          |---|---|---|
          | **`AF-S`** · Single · One Shot | le sujet ne bouge pas | le point est fait, puis verrouillé |
          | **`AF-C`** · Continuous · AI Servo | le sujet bouge | l'appareil corrige en continu |
        ton: avertissement
        icone: lucide:triangle-alert
        encadre: |
          Toutes les marques n'utilisent pas les mêmes mots.

      - id: zone-af
        genre: panneau
        titre: Désigner où viser
        claim: "Et pour désigner où : trois façons."
        corps: |
          | Méthode | Quand | Ce qu'il fait |
          |---|---|---|
          | **Collimateur unique** | vous voulez choisir vous-même l'endroit exact | un seul point actif, que vous déplacez avec le joystick ou le pavé directionnel |
          | **Zone** | le sujet bouge mais reste dans un coin du cadre | l'appareil corrige parmi plusieurs collimateurs de cette zone |
          | **Détection visage / œil** | il y a un visage dans le cadre | l'appareil détecte le visage — et l'œil, s'il est visible — puis y verrouille le point |

      - id: ou-le-point-a-ete-fait
        genre: demonstration
        titre: Où le point a-t-il été fait ?
        claim: Où l'appareil a-t-il fait le point, et où le photographe voulait-il le faire ?
        series:
          - variable: l'endroit où le point a été fait
            images:
              - id: l1-map-oeil
                specification: Portrait, point sur l'œil · 85 mm · f/2.8
                valeur: sur l'œil
                priorite: utile
                reglages: { point: œil, ouverture: f/2.8, focale: 85 mm }
              - id: l1-map-oreille
                specification: Même portrait, point sur l'oreille · 85 mm · f/2.8
                valeur: sur l'oreille
                priorite: utile
                reglages: { point: oreille, ouverture: f/2.8, focale: 85 mm }
              - id: l1-map-arriere-plan
                specification: Même portrait, point sur l'arrière-plan · 85 mm · f/2.8
                valeur: sur l'arrière-plan
                priorite: utile
                reglages: { point: arrière-plan, ouverture: f/2.8, focale: 85 mm }

        images:
          - id: l1-hors-focus
            specification: Sujet hors mise au point, décor net · vitesse suffisante, 1/250 s
            valeur: le point est ailleurs — le décor est net
            priorite: essentiel

        aparte: "Seule chose qui change : l'endroit où le point a été fait."

      - id: designer-le-point
        genre: appareil-en-main
        titre: Appareil en main — désigner le point
        claim: Trois gestes, dans l'ordre.
        gestes:
          - "**Trouvez votre sélecteur de zone AF** et mettez-le sur un **collimateur unique** — ou « zone flexible », selon les marques."
          - "**Déplacez le collimateur** : pavé directionnel, joystick, ou écran tactile sur les sans-miroir."
          - "**Faites le point sur un objet précis** de votre table, puis vérifiez sur l'écran que c'est bien lui qui est net."
        cellulaire: |
          Touchez l'écran à l'endroit où vous voulez le point. Un petit carré apparaît. C'est
          exactement le même geste. Maintenez le doigt une seconde pour le verrouiller.
        aparte: |
          Attention les mots changent d'une marque à l'autre.

  # ─────────────────────────────────────────────────────────────────────────
  - id: pause
    titre: Pause et questions
    resume: Le moment où les questions se posent vraiment.
    ecrans:
      - id: la-pause
        genre: repere
        variante: pause
        titre: Pause
        claim: Dix minutes.
        corps: |
          Une feuille est posée sur votre table.

          **Si une question vous vient, écrivez-la sur la feuille.** Elle reste sur la table
          pendant la pause. Quand tout le monde revient, votre table essaie d'y répondre
          ensemble, avant qu'on en parle en groupe.
        aparte: |
          C'est aussi le moment de venir poser une question à voix basse plutôt qu'à voix haute.
          C'est prévu, et c'est bienvenu.

      - id: vos-questions
        genre: repere
        variante: questions
        titre: Vos questions
        claim: Ce que vos tables n'ont pas réglé.
        corps: |
          Chaque table a essayé de répondre à ses propres questions.

          **Ce qui reste, on le met en commun.** Une autre table a peut-être déjà la réponse —
          n'importe qui peut répondre, pas seulement l'animateur ou l'animatrice.

  # ─────────────────────────────────────────────────────────────────────────
  - id: ouverture-et-profondeur-de-champ
    titre: L'ouverture et la profondeur de champ
    resume: Ce que change le trou de l'objectif — la lumière, et l'épaisseur de ce qui est net.
    ecrans:
      - id: ouverture
        genre: repere
        variante: ouverture
        titre: L'ouverture
        claim: L'ouverture, c'est la grandeur du trou qui laisse passer la lumière dans votre objectif.
        corps: |
          On l'indique avec un `f` suivi d'un chiffre : `f/2.4`, `f/11`, `f/22`.

      # ★ Activité puis révélation : la-question fait discuter les tables une
      #   minute sans rien montrer d'autre ; la-reponse est un panneau statique
      #   séparé qui révèle la réponse et rassure les tables qui ont dit f/22.
      - id: la-question
        genre: repere
        variante: activite
        titre: La question
        claim: Entre `f/2.4` et `f/22`, lequel laisse passer le plus de lumière ?
        corps: |
          **Une minute.** À votre table, mettez-vous d'accord sur une réponse.

      - id: la-reponse
        genre: panneau
        titre: La réponse
        claim: C'est `f/2.4`.
        corps: |
          Le chiffre après le `f/` est plus grand pour `f/22` — et pourtant c'est l'inverse : plus
          ce chiffre est grand, plus le trou est petit.
        encadre: |
          **C'est `f/2.4`.** Si vous avez répondu `f/22`, votre raisonnement était logique : 22 est
          plus grand que 2,4. **C'est la notation qui est piégeuse, pas vous.**
        ton: reponse

      - id: le-f-est-une-division
        genre: interactif
        titre: Le `f/` est une division
        claim: '`f/2.4` et `f/22`, sur le même 50 mm : deux trous très différents.'
        composant: ouverture-division
        props:
          focaleA: 50
          ouvertureA: 2.4
          focaleB: 50
          ouvertureB: 22
        aparte: |
          Le chiffre `f/` est un rapport, pas une mesure : deux objectifs au même `f/` peuvent
          transmettre des quantités de lumière différentes selon leurs lentilles. C'est pour ça
          que le cinéma utilise plutôt les T-stops.

      - id: deux-retombees
        genre: panneau
        titre: Deux retombées concrètes
        claim: Voilà pourquoi votre objectif dit « 18-55 mm f/3.5-5.6 », et pourquoi les gros téléobjectifs coûtent une fortune.
        corps: |
          **Pourquoi votre kit dit `f/3.5-5.6`.** À 18 mm, `f/3.5` demande un trou de 5 mm —
          facile. À 55 mm, il en faudrait un de 16 mm : gros et cher. Le fabricant a préféré le
          laisser rétrécir.

          **Conséquence : en zoomant, vous perdez de la lumière.**

          **Pourquoi les gros téléobjectifs coûtent une fortune.** Un 400 mm `f/2.8` réclame un
          trou de **143 mm** — presque 15 cm de verre.
        schema:
          composant: diametre-ouverture
          props:
            focale: 50
            ouvertures: [2, 4, 5.6, 16]
          legende: Un 50 mm, quatre réglages, quatre trous — à la même échelle.

      - id: les-quatre-leviers
        genre: panneau
        titre: Les quatre leviers
        claim: Pour contrôler ce qui est flou, vous avez quatre leviers.
        corps: |
          1. **L'ouverture** — le réglage
          2. **Votre distance au sujet** — vos pieds
          3. **La focale** — votre zoom
          4. **La distance entre le sujet et le fond** — les pieds de votre sujet

          C'est l'important à retenir.
        schema:
          composant: quatre-leviers

      - id: la-definition
        genre: panneau
        titre: La profondeur de champ
        claim: La profondeur de champ est la zone qui semble suffisamment nette, devant et derrière l'endroit où vous avez fait le point.
        corps: |
          Trois mots comptent : **une zone**, pas un plan ; **devant et derrière** le point ; qui
          **semble** nette.

          | | À quoi ça sert |
          |---|---|
          | **Zone mince** | Le sujet se détache, le reste fond. Portrait, détail, sujet isolé. |
          | **Zone épaisse** | Tout est lisible du premier plan à l'horizon. Paysage, groupe, photo de rue. |
        schema:
          composant: zone-nette
          legende: Une zone et elle s'étend des deux côtés.

      - id: ce-qui-change-l-epaisseur
        genre: panneau
        titre: Ce qui change l'épaisseur
        claim: Trois choses changent l'épaisseur de la zone nette. Deux n'ont rien à voir avec les réglages.
        corps: |
          | | Effet sur la zone nette |
          |---|---|
          | **1 · L'ouverture** | Grand trou → zone **mince**. Petit trou → zone **épaisse**. |
          | **2 · La distance à laquelle vous faites le point** | Plus votre sujet est **près**, plus la zone est **mince**. |
          | **3 · La focale** | Plus vous êtes **zoomé**, plus la zone paraît **mince**. |
        schema:
          composant: zone-nette
          props:
            epaisseur: 0.22
          legende: Fermer l'ouverture épaissit la zone. Le point, lui, ne bouge pas.

      - id: demo-ouverture
        genre: demonstration
        titre: L'ouverture, en photos
        claim: Même sujet, même distance, même focale. Seul le chiffre `f/` change.
        series:
          - variable: l'ouverture
            constantes:
              sujet: le même
              distance: 2 m
              focale: 50 mm
            legende: "Rien de surprenant ici : plus le trou est grand, plus le fond se dissout."
            images:
              - id: l1-pdc-ouverture-18
                specification: Même sujet, f/1.8 · 50 mm · sujet à 2 m
                valeur: f/1.8
                priorite: utile
                reglages: { ouverture: f/1.8, distance: 2 m, focale: 50 mm }
              - id: l1-pdc-ouverture-56
                specification: Même sujet, f/5.6 · 50 mm · 2 m · sujet bien détaché du fond
                valeur: f/5.6
                priorite: essentiel
                reglages: { ouverture: f/5.6, distance: 2 m, focale: 50 mm }
              - id: l1-pdc-ouverture-11
                specification: Même sujet, f/11 · 50 mm · sujet à 2 m
                valeur: f/11
                priorite: utile
                reglages: { ouverture: f/11, distance: 2 m, focale: 50 mm }

      # ★ Panneau cumulatif nº 1 : le tableau est la surprise du bloc. Il ne peut
      #   pas être affiché pendant qu'on annonce que seule la distance change,
      #   sinon il ne reste rien à découvrir.
      - id: le-facteur-invisible
        genre: panneau
        titre: Le facteur invisible
        claim: Même objectif, même ouverture. Seule la distance du sujet change.
        corps: |
          Capteur **APS-C**, objectif courant réglé à **50 mm** : à cette focale, son ouverture
          maximale — celle qui laisse passer le plus de lumière — est `f/5.6`.

          De combien la zone nette change-t-elle entre un sujet à **3 mètres** et un sujet à
          **1 mètre** ?
        schema:
          composant: distance-sujet
          props:
            distances: [1, 3]
          legende: Même appareil, même objectif, même ouverture — seule la distance change.
        etats:
          - etiquette: La question
          - etiquette: Les chiffres
            corps: |
              | 50 mm, `f/5.6`, capteur APS-C | Zone nette |
              |---|---|
              | Sujet à **1 mètre** | environ **8 cm** |
              | Sujet à **3 mètres** | environ **77 cm** |
              | Sujet à **10 mètres** | **plusieurs mètres — en pratique, tout** |
            encadre: |
              De **3 m à 1 m**, votre zone nette est **divisée par dix** — sans avoir touché à un
              seul réglage.
            ton: regle

      - id: demo-la-distance
        genre: demonstration
        titre: La série la plus importante
        claim: Même objectif, même ouverture. Seule la distance change.
        series:
          - variable: la distance de mise au point
            constantes:
              focale: 50 mm
              ouverture: f/5.6
            legende: >-
              Elle montre le facteur invisible : le même réglage donne un fond fondu dans un cas et un
              fond parfaitement lisible dans l'autre.
            images:
              - id: l1-pdc-distance-1m
                specification: 50 mm, f/5.6, sujet à 1 m — même cadrage du sujet
                valeur: sujet à 1 m
                priorite: essentiel
                reglages: { distance: 1 m, focale: 50 mm, ouverture: f/5.6 }
              - id: l1-pdc-distance-5m
                specification: 50 mm, f/5.6, sujet à 5 m — même cadrage du sujet
                valeur: sujet à 5 m
                priorite: essentiel
                reglages: { distance: 5 m, focale: 50 mm, ouverture: f/5.6 }

      - id: explorer-la-zone-nette
        genre: interactif
        titre: Explorer la zone nette
        claim: Quatre leviers. Un seul est un réglage.
        composant: profondeur-de-champ
        props:
          format: aps-c
          distance: 3
          focale: 50
          ouverture: 5.6
          fond: 3

      - id: trois-frustrations
        genre: panneau
        titre: Trois frustrations que vous avez déjà vécues
        claim: Ces trois situations ne sont pas des erreurs de votre part. C'est de la physique.
        corps: |
          | Problème | Pourquoi | Comment faire |
          |---|---|---|
          | **Un seul œil net** en portrait rapproché | Avec un 50 mm `f/1.8` à 1 m, la zone tombe à **2,6 cm** sur APS-C. Un visage de trois-quarts est plus épais que ça. | Fermez à `f/2.8` ou `f/4`, ou reculez d'un pas. |
          | **Un seul pétale net** en gros plan | En macro, la zone se compte en **millimètres**. | Fermez à `f/8` ou `f/11`, et compensez la perte de lumière avec un trépied. |
          | **`f/16` et exposition trop longue** | À quelques mètres, tout est déjà net **de toute façon** — dès `f/5.6`. `f/16` ne fait que voler de la lumière. | Ouvrez à `f/5.6` ou `f/8` : même netteté, vitesse plus rapide. |

      - id: paysage-deux-causes
        genre: panneau
        titre: Le paysage a deux causes de flou possibles
        claim: Un paysage flou n'a pas toujours la même cause.
        corps: |
          | Problème | Pourquoi | Comment faire |
          |---|---|---|
          | **Paysage flou à `f/2`** | Une ouverture trop large rétrécit la zone nette sous ce qu'il faut au paysage. | Fermez un peu — `f/5.6` ou `f/8` couvrent tout le paysage. |
          | **Premier plan ou fond flou** malgré la bonne ouverture | Ce n'est pas l'ouverture — la zone nette est bien là, mais mal placée. | Déplacez le point de mise au point : ce n'est pas la même chose que fermer davantage. |

      - id: le-probleme
        genre: panneau
        titre: Le problème
        claim: La distance entre votre sujet et le fond ne change pas la zone nette. Elle change tout au flou du fond.
        corps: |
          Ce quatrième facteur est d'une autre nature que les trois autres : il **ne modifie pas**
          l'épaisseur de la zone nette, mais **plus l'arrière-plan est loin en dehors de cette
          zone, plus il paraît flou**.
        encadre: |
          **`f/1.8` ne garantit pas un arrière-plan flou.** Si le mur derrière votre sujet est dans
          la zone nette, ou juste à côté, aucune ouverture n'y change grand-chose.
        ton: neutre

      - id: la-solution
        genre: panneau
        titre: La solution
        claim: "Les quatre leviers marchent dans les deux sens : le même geste qui floute le fond peut aussi le garder net."
        corps: |
          | Levier | Fond flou | Fond net |
          |---|---|---|
          | **Ouverture** | ouvrez (`f/1.8`) | fermez (`f/11`) |
          | **Distance au sujet** | rapprochez-vous | éloignez-vous |
          | **Focale** | zoomez | dézoomez |
          | **Distance du fond** | éloignez-le du sujet | rapprochez-le du sujet |
        encadre: |
          Vous n'avez peut-être pas besoin d'un nouvel objectif : vous avez besoin de comprendre
          comment il fonctionne.
        ton: regle

      - id: exemple-fond-flou
        genre: demonstration
        titre: Collé au mur, ou loin derrière
        claim: Même objectif, même ouverture. Seule la distance entre le sujet et le fond change.
        series:
          - variable: la distance entre le sujet et le fond
            constantes:
              ouverture: f/5.6
              focale: 50 mm
              distance au sujet: 2 m
            legende: Avec le même objectif — la preuve qu'on peut faire beaucoup avec une seule lentille.
            images:
              - id: l1-pdc-fond-colle
                specification: 50 mm, f/5.6 · sujet collé au mur · photographe à 2 m
                valeur: sujet collé au mur
                priorite: essentiel
                reglages: { fond: collé, ouverture: f/5.6, focale: 50 mm }
              - id: l1-pdc-fond-loin
                specification: 50 mm, f/5.6 · sujet à 3 m du mur · photographe à 2 m
                valeur: sujet à 3 m du mur
                priorite: essentiel
                reglages: { fond: 3 m, ouverture: f/5.6, focale: 50 mm }

      - id: tourner-la-molette
        genre: appareil-en-main
        titre: Appareil en main — l'ouverture
        claim: Passez en mode A, et faites varier le chiffre du plus petit au plus grand.
        gestes:
          - "**Passez en mode `A`** — ou **`Av`** sur un Canon. Trouvez-le sur votre molette."
          - "**Trouvez la molette qui change le chiffre `f/`.** Allez de votre plus petit chiffre à votre plus grand, en regardant le nombre changer."
          - "**Photographiez votre voisin de table** au plus petit chiffre, puis à `f/11`. Comparez sur l'écran."
          - "**Sans toucher à vos réglages**, refaites la photo de très près, puis en reculant de trois pas. Comparez les deux fonds."
        cellulaire: |
          Vous n'avez pas d'ouverture réglable. Votre équivalent est le **mode Portrait**, qui
          simule le flou. Et surtout : **le facteur « distance » fonctionne pareil pour vous** —
          approchez-vous du sujet, éloignez-le du fond. C'est du vrai flou, pas du calcul.
        reflex: |
          Vous ne verrez pas l'effet dans le viseur — il montre toujours la pleine ouverture.
          Regardez l'écran **après** la photo. C'est normal.

  # ─────────────────────────────────────────────────────────────────────────
  - id: repartir
    titre: Votre appareil est prêt, et votre défi
    resume: Personne ne quitte la salle sans avoir configuré son appareil.
    ecrans:
      - id: configurez-maintenant
        genre: appareil-en-main
        titre: Configurez maintenant
        claim: Cinq réglages. C'est votre configuration pour les trois prochaines semaines.
        gestes:
          - "**Mode `A`** *(ou `Av` sur un Canon)*."
          - "**ISO automatique**, avec une limite haute à 3200 ou 6400."
          - "**`AF-S`**, collimateur unique ou détection de l'œil."
          - "**Repérez le bouton `+/−` au toucher**, sans regarder. Faites `−1`, puis `+1`, puis revenez à `0`. Si votre photo est trop sombre, tournez vers le `+`. Trop claire, vers le `−`. C'est tout, et ça marche. On verra pourquoi à la séance 2."
          - "**Format `RAW + JPEG`** si votre appareil le permet. On s'en servira à la troisième séance."
        cellulaire: |
          Activez la **grille** de composition, et repérez le geste de compensation : touchez
          l'écran, puis glissez le doigt vers le haut ou le bas. C'est le réglage le plus utile de
          votre téléphone. Sur un modèle `Pro`, activez aussi le RAW.

      - id: le-defi
        genre: panneau
        titre: Le défi
        claim: Cinq photos. Cinq exercices.
        corps: |
          - Une photo avec un **arrière-plan flou**
          - Une photo où **une grande partie de la scène est nette**
          - Une photo où vous avez choisi l'endroit précis de la **mise au point**
          - Une photo où l'on voit clairement **d'où vient la lumière**
          - Une photo dans une **lumière que vous trouvez intéressante**

          **Si elles sont ratées, elles sont encore plus utiles.**
        aparte: |
          Rien à envoyer. L'exercice est pour vous aider.

      - id: derniere-question
        genre: repere
        variante: cloture
        titre: La question de fin
        claim: Qui se sent à l'aise, aujourd'hui, de sortir son appareil du mode automatique ?
        corps: |
          À main levée, et il n'y a pas de mauvaise réponse.
